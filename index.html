  p05: [
    ['Em "Ele tem um coração de pedra", a expressão "coração de pedra" está em sentido:', ['conotativo (figurado)', 'denotativo (literal)', 'técnico', 'científico', 'jurídico'], 'Denotação: sentido literal, de dicionário. Conotação: sentido figurado. Aqui significa que a pessoa é insensível.'],
    ['As palavras "cela" (prisão) e "sela" (de cavalo) são:', ['homônimas homófonas', 'sinônimas', 'antônimas', 'parônimas com mesmo sentido', 'polissêmicas'], 'Homófonas: mesmo som, escrita e sentido diferentes. Parônimas são parecidas, mas não iguais (comprimento/cumprimento).']
  ],
  p06: [
    ['Em "Estou morrendo de fome", há uma figura de linguagem chamada:', ['hipérbole', 'eufemismo', 'metonímia', 'ironia', 'antítese'], 'Hipérbole é o exagero intencional para dar ênfase. Ninguém está literalmente morrendo; está com muita fome.'],
    ['Em "Li Machado de Assis nas férias", a figura de linguagem é:', ['metonímia (o autor no lugar da obra)', 'metáfora', 'hipérbole', 'pleonasmo', 'onomatopeia'], 'Metonímia é trocar um termo por outro com o qual tem relação próxima: autor pela obra, marca pelo produto ("tomar um Toddy"), parte pelo todo.']
  ],
  p07: [
    ['Na frase "Estudou muito, mas não passou", a conjunção "mas" estabelece relação de:', ['oposição (adversidade)', 'causa', 'conclusão', 'adição', 'tempo'], 'Mas, porém, contudo, todavia e no entanto indicam oposição. Mudar o conector muda o sentido do texto: o ENEM cobra muito isso.'],
    ['O uso de pronomes e sinônimos para retomar termos já citados, evitando repetição, garante ao texto:', ['coesão', 'ambiguidade', 'incoerência', 'redundância', 'informalidade'], 'Coesão é a ligação entre as partes do texto (retomadas e conectores). Coerência é o sentido lógico do todo.']
  ],
  p08: [
    ['Na frase "O menino feliz correu", a palavra "feliz" é um:', ['adjetivo', 'substantivo', 'verbo', 'advérbio', 'pronome'], 'Adjetivo caracteriza o substantivo (menino). Se fosse "A felicidade do menino", felicidade seria substantivo.'],
    ['Em "Comprei a terceira caixa", a palavra "terceira" é um numeral:', ['ordinal', 'cardinal', 'multiplicativo', 'fracionário', 'coletivo'], 'Cardinal: quantidade (três). Ordinal: ordem (terceiro). Multiplicativo: dobro, triplo. Fracionário: metade, terço.']
  ],
  p09: [
    ['Na frase "Maria disse que ela viria", o pronome "ela" pode gerar:', ['ambiguidade, pois pode se referir a Maria ou a outra pessoa', 'erro de concordância', 'coesão perfeita sempre', 'erro de ortografia', 'mudança de tempo verbal'], 'Pronomes retomam termos, mas se houver mais de um referente possível, o sentido fica duplo. Em textos formais, é preciso deixar claro.'],
    ['Em "Este livro aqui é meu", o pronome "este" indica que o livro está:', ['perto de quem fala', 'perto de quem ouve', 'longe dos dois', 'no passado distante', 'em outro texto'], 'Este/isto: perto de quem fala. Esse/isso: perto de quem ouve. Aquele/aquilo: longe dos dois.']
  ],
  p10: [
    ['Em "Se eu estudasse, passaria", o verbo "estudasse" está no modo:', ['subjuntivo (hipótese)', 'indicativo (certeza)', 'imperativo (ordem)', 'infinitivo', 'gerúndio'], 'Indicativo exprime certeza; subjuntivo, dúvida ou hipótese; imperativo, ordem ou pedido.'],
    ['Na frase "O bolo foi feito pela avó", o verbo está na voz:', ['passiva analítica', 'ativa', 'reflexiva', 'passiva sintética', 'média'], 'Na voz ativa seria "A avó fez o bolo". Na passiva analítica, o objeto vira sujeito e aparece ser/estar + particípio + agente ("pela avó").']
  ],
  p11: [
    ['Na frase "Ela fala muito bem", as palavras "muito" e "bem" são:', ['advérbios', 'adjetivos', 'substantivos', 'pronomes', 'conjunções'], 'Advérbios modificam verbos, adjetivos ou outros advérbios. "Bem" modifica o verbo falar (modo) e "muito" modifica "bem" (intensidade).'],
    ['Em "Saiu sem casaco", a preposição "sem" indica:', ['ausência', 'lugar', 'causa', 'finalidade', 'tempo'], 'Preposições ligam palavras e criam relações de sentido: sem (ausência), com (companhia), para (finalidade), de (origem/posse), em (lugar).']
  ],
  p12: [
    ['Na frase "Os alunos fizeram a prova", qual é o sujeito?', ['Os alunos', 'a prova', 'fizeram', 'fizeram a prova', 'não há sujeito'], 'O sujeito é o termo com o qual o verbo concorda: "os alunos fizeram". "A prova" é o objeto direto.'],
    ['Na frase "Choveu muito ontem", o sujeito é:', ['inexistente (oração sem sujeito)', 'muito', 'ontem', 'oculto: "ele"', 'indeterminado'], 'Verbos que indicam fenômenos da natureza (chover, ventar, nevar) são impessoais: a oração não tem sujeito.']
  ],
  p13: [
    ['Em "Não fui à aula porque estava doente", a oração "porque estava doente" expressa:', ['causa', 'consequência', 'condição', 'concessão', 'finalidade'], 'É uma oração subordinada adverbial causal: explica o motivo de não ter ido. Conectivos causais: porque, já que, visto que, como (no início).'],
    ['Em "Embora estivesse cansado, continuou estudando", a oração iniciada por "embora" indica:', ['concessão', 'causa', 'conclusão', 'tempo', 'condição'], 'Concessão: um fato que poderia impedir o outro, mas não impede. Conectivos: embora, ainda que, mesmo que, apesar de que (com subjuntivo).']
  ],
  p14: [
    ['A frase "Subir para cima" contém um vício de linguagem chamado:', ['pleonasmo vicioso (redundância)', 'ambiguidade', 'cacofonia', 'barbarismo', 'neologismo'], 'Quem sobe só pode ir para cima. O pleonasmo vicioso repete uma ideia sem acrescentar nada. Na poesia, o pleonasmo pode ser intencional e expressivo.'],
    ['A frase "Vendo casaco de couro para senhora usado" é problemática por causa de:', ['ambiguidade', 'pleonasmo', 'erro de grafia', 'excesso de vírgulas', 'uso de gíria'], 'Não fica claro se "usado" se refere ao casaco ou à senhora. A ordem das palavras pode criar duplo sentido; o ideal seria "casaco de couro usado, para senhora".']
  ],
  p15: [
    ['Qual frase usa o "porquê" corretamente?', ['Não sei o porquê da sua ausência', 'Porquê você faltou?', 'Faltei por que estava doente', 'Você faltou porquê?', 'Não sei porquê você faltou'], 'Por que: perguntas e "pelo qual". Porque: explicação/resposta. Por quê: no fim da frase. Porquê: substantivo, com artigo ("o porquê").'],
    ['Por que a palavra "café" leva acento?', ['É oxítona terminada em "e"', 'É paroxítona terminada em "e"', 'É proparoxítona', 'Todas as palavras com "é" levam acento', 'Para diferenciar de outra palavra igual'], 'Oxítonas (sílaba tônica na última) terminadas em a, e, o (seguidas ou não de s) e em, ens são acentuadas: café, sofá, avô, também.']
  ],
  p16: [
    ['Em qual frase o uso da crase está correto?', ['Fui à escola ontem', 'Fui à pé para casa', 'Comecei à estudar', 'Entreguei o livro à ele', 'Vou à Curitiba amanhã'], 'Crase = preposição "a" + artigo "a". "Ir a" + "a escola" = à escola. Não há crase antes de masculino (a pé), verbo (a estudar), pronome pessoal (a ele) e cidade sem artigo (a Curitiba).'],
    ['Qual frase está pontuada corretamente segundo a norma-padrão?', ['Os alunos, cansados, saíram cedo.', 'Os alunos, saíram cedo.', 'Os alunos cansados, saíram cedo.', 'Os, alunos cansados saíram cedo.', 'Os alunos saíram, cedo.'], 'Não se separa o sujeito do verbo com vírgula. Já "cansados", entre vírgulas, é um termo intercalado (aposto/predicativo) e fica correto.']
  ],
  p17: [
    ['Qual frase está de acordo com a concordância da norma-padrão?', ['Fazia dois anos que não o via', 'Faziam dois anos que não o via', 'Houveram muitos problemas', 'Existe muitas pessoas na fila', 'Haviam várias opções'], 'O verbo "fazer" indicando tempo e o verbo "haver" no sentido de existir são impessoais e ficam no singular. "Existir" é pessoal: "existem muitas pessoas".'],
    ['Segundo a norma-padrão, qual frase apresenta a regência correta do verbo "assistir" no sentido de ver?', ['Assisti ao filme ontem', 'Assisti o filme ontem', 'Assisti no filme ontem', 'Assisti pelo filme ontem', 'Assisti com o filme ontem'], 'No sentido de ver, "assistir" pede a preposição "a": assistir ao jogo, assistir à aula. Na fala do dia a dia, "assisti o filme" é comum, mas não é a norma-padrão.']
  ],
  p18: [
    ['A palavra "infelizmente" foi formada pelo processo de:', ['derivação prefixal e sufixal (in- + feliz + -mente)', 'composição por justaposição', 'composição por aglutinação', 'derivação regressiva', 'onomatopeia'], 'Prefixo in- (negação) + radical feliz + sufixo -mente (forma advérbio). Composição une dois radicais, como em "guarda-chuva".'],
    ['Quantos fonemas (sons) há na palavra "chave"?', ['4', '5', '3', '6', '2'], 'Ch-a-v-e: o dígrafo "ch" representa um único som (/x/). São 5 letras e 4 fonemas.']
  ],
  // ---------- Literatura e Artes ----------
  l01: [
    ['O que diferencia um texto literário de um texto não literário, em geral?', ['O literário trabalha a linguagem de forma estética e conotativa; o não literário prioriza informar de forma objetiva', 'O literário sempre rima', 'O não literário é sempre falso', 'O literário não pode ter narrador', 'Não há diferença'], 'Um poema sobre a chuva e uma notícia sobre a chuva tratam do mesmo tema, mas o poema explora sons, imagens e sentidos figurados.'],
    ['A arte, para além de ser bonita, tem como função importante:', ['expressar visões de mundo e provocar reflexão sobre a realidade', 'apenas decorar ambientes', 'ser entendida só por especialistas', 'copiar a natureza fielmente sempre', 'servir só para vender'], 'A arte comunica sentimentos, critica a sociedade e registra culturas. Pode causar estranhamento justamente para fazer pensar.']
  ],
  l02: [
    ['Qual gênero literário é marcado pela expressão de sentimentos e emoções de um "eu lírico"?', ['Lírico', 'Épico', 'Dramático', 'Narrativo jornalístico', 'Científico'], 'Lírico: subjetividade, em geral em versos. Épico/narrativo: conta uma história com narrador. Dramático: feito para ser encenado, com diálogos.'],
    ['Um poema com dois quartetos e dois tercetos (14 versos) é chamado de:', ['soneto', 'haicai', 'cordel', 'epopeia', 'crônica'], 'O soneto tem 14 versos (4 + 4 + 3 + 3) e foi muito usado por Camões, pelos árcades e parnasianos e por Vinicius de Moraes.']
  ],
  l03: [
    ['As pinturas rupestres, como as da Serra da Capivara (PI), são importantes porque:', ['registram o modo de vida e as crenças dos grupos humanos pré-históricos', 'foram feitas pelos portugueses', 'são obras do Renascimento', 'mostram a escrita alfabética', 'foram pintadas no século XX'], 'Feitas em paredes de cavernas e rochas com pigmentos naturais, mostram caça, rituais e animais. A Serra da Capivara é Patrimônio Mundial.'],
    ['A arte grega clássica valorizava principalmente:', ['equilíbrio, proporção e idealização do corpo humano', 'deformação e exagero das formas', 'temas exclusivamente religiosos cristãos', 'arte abstrata', 'fotografia'], 'As esculturas gregas buscavam a beleza ideal, com proporções harmoniosas. Esses ideais foram retomados no Renascimento e no Neoclassicismo.']
  ],
  l04: [
    ['As cantigas trovadorescas medievais eram classificadas em líricas e satíricas. Nas cantigas de amigo, o eu lírico é:', ['feminino, uma moça que sofre pela ausência do amado', 'masculino, que idealiza uma dama inalcançável', 'um rei narrando batalhas', 'um padre falando de Deus', 'um animal falante'], 'Na cantiga de amigo, embora escrita por homens, quem fala é uma mulher do povo. Na cantiga de amor, um homem sofre por uma dama nobre e inacessível (coita amorosa).'],
    ['Gil Vicente, autor do Humanismo português, ficou conhecido por:', ['peças de teatro que criticavam a sociedade, como o "Auto da Barca do Inferno"', 'sonetos amorosos renascentistas', 'romances realistas', 'poemas concretos', 'cantigas de amigo'], 'Nos autos, Gil Vicente satiriza tipos sociais (o padre corrupto, o fidalgo arrogante, o agiota) que são julgados antes de embarcar para o céu ou o inferno.']
  ],
  l05: [
    ['"Os Lusíadas", de Camões, é uma epopeia que narra:', ['a viagem de Vasco da Gama às Índias e as glórias do povo português', 'o amor de Romeu e Julieta', 'a independência do Brasil', 'a vida no sertão nordestino', 'a Guerra de Canudos'], 'Publicada em 1572, é o grande poema épico do Classicismo português, inspirado nas epopeias greco-latinas, em versos decassílabos.'],
    ['O Classicismo (Renascimento) na literatura valorizava:', ['a razão, o equilíbrio e a imitação dos modelos greco-latinos', 'o sentimentalismo exagerado', 'a ruptura total com a tradição', 'os temas do cotidiano urbano moderno', 'a linguagem coloquial e sem regras'], 'Antropocentrismo, racionalismo, perfeição formal e retomada da cultura clássica. O soneto e a medida nova (decassílabo) se destacam.']
  ],
  l06: [
    ['A Carta de Pero Vaz de Caminha (1500) é considerada um texto do:', ['Quinhentismo (literatura informativa)', 'Barroco', 'Romantismo', 'Modernismo', 'Arcadismo'], 'O Quinhentismo inclui textos de viajantes que descreviam a nova terra (informativos) e textos jesuíticos de catequese, como os de José de Anchieta.'],
    ['O Barroco, no Brasil, é marcado por:', ['conflito entre fé e prazer, uso de antíteses e paradoxos', 'equilíbrio e simplicidade bucólica', 'nacionalismo e indianismo', 'objetividade científica', 'verso livre e humor'], 'Gregório de Matos ("Boca do Inferno") e o Padre Antônio Vieira (sermões) são os principais nomes. A arte barroca expressa a tensão entre o espiritual e o material.']
  ],
  l07: [
    ['O Arcadismo valorizava:', ['a vida simples no campo (bucolismo) e o equilíbrio racional', 'a vida agitada das grandes cidades', 'o pessimismo e a morte', 'a fragmentação e o verso livre', 'o exagero de figuras e contrastes'], 'Lemas latinos como "fugere urbem" (fugir da cidade) e "carpe diem" (aproveitar o dia) marcam o Arcadismo. Os poetas usavam pseudônimos de pastores.'],
    ['Qual autor árcade escreveu "Marília de Dirceu" e participou da Inconfidência Mineira?', ['Tomás Antônio Gonzaga', 'Gregório de Matos', 'José de Alencar', 'Castro Alves', 'Olavo Bilac'], 'Gonzaga, sob o pseudônimo de pastor Dirceu, escreveu poemas para sua amada Marília. Foi preso e degredado por participar da Inconfidência.']
  ],
  l08: [
    ['A primeira geração romântica no Brasil foi marcada por:', ['nacionalismo e indianismo, com o indígena como herói', 'pessimismo e o "mal do século"', 'poesia social abolicionista', 'objetividade e crítica social', 'experimentalismo formal'], 'Gonçalves Dias ("Canção do Exílio", "I-Juca-Pirama") buscava construir uma identidade nacional após a independência.'],
    ['Castro Alves, autor de "O Navio Negreiro", é o principal poeta da geração romântica:', ['condoreira, com poesia social e abolicionista', 'indianista', 'ultrarromântica', 'parnasiana', 'modernista'], 'A terceira geração (condoreira) usava linguagem grandiosa para denunciar injustiças, especialmente a escravidão. Castro Alves é o "poeta dos escravos".']
  ],
  l09: [
    ['"Iracema", de José de Alencar, é um romance:', ['indianista, que simboliza a formação do povo brasileiro', 'urbano, sobre a sociedade carioca', 'realista e psicológico', 'naturalista, sobre cortiços', 'modernista experimental'], 'A união da indígena Iracema com o português Martim gera Moacir, símbolo do brasileiro mestiço. "Iracema" é anagrama de América.'],
    ['O romance regionalista romântico, como "O Sertanejo", de Alencar, procurava:', ['retratar costumes e paisagens das diferentes regiões do Brasil de forma idealizada', 'criticar duramente a burguesia urbana', 'mostrar o ser humano como produto do meio, com base científica', 'romper com a tradição usando verso livre', 'imitar os modelos gregos'], 'O regionalismo romântico mostrava o interior do Brasil (sertão, gaúcho), mas com heróis idealizados, diferente do regionalismo crítico do Romance de 30.']
  ],
  l10: [
    ['"Memórias Póstumas de Brás Cubas" (1881) inaugura o Realismo no Brasil. Seu narrador é:', ['um defunto autor, que narra a própria vida depois de morto', 'um narrador observador neutro', 'um indígena', 'um sertanejo', 'uma criança'], 'Machado de Assis cria um narrador irônico, que conversa com o leitor e critica a elite carioca com humor e pessimismo.'],
    ['Em "Dom Casmurro", de Machado de Assis, a grande dúvida que o leitor enfrenta é:', ['se Capitu traiu ou não Bentinho', 'quem matou Brás Cubas', 'se o Brasil será independente', 'onde está o tesouro', 'quem é o pai de Iracema'], 'Como a história é narrada por Bentinho, ciumento, o leitor só tem a versão dele. A ambiguidade é proposital e típica do Realismo psicológico de Machado.']
  ],
  l11: [
    ['"O Cortiço", de Aluísio Azevedo, é um romance naturalista porque:', ['mostra o ser humano determinado pelo meio, pela raça e pelo momento, com base em teorias científicas', 'idealiza os heróis', 'valoriza o indígena', 'usa versos livres', 'fala de cavaleiros medievais'], 'O Naturalismo leva o Realismo ao extremo: personagens são movidos por instintos e influências do ambiente, comparados muitas vezes a animais (zoomorfização).'],
    ['O Parnasianismo, de Olavo Bilac, defendia:', ['a "arte pela arte", com perfeição formal, rimas ricas e métrica rigorosa', 'o verso livre e a linguagem coloquial', 'o engajamento político', 'o sentimentalismo exagerado', 'a mistura de imagens e sons misteriosos'], 'Os parnasianos buscavam o poema perfeito, como um ourives trabalha uma joia. Os modernistas de 22 iriam ridicularizar esse formalismo.']
  ],
  l12: [
    ['O Simbolismo, cujo principal nome no Brasil é Cruz e Sousa, caracteriza-se por:', ['musicalidade, sugestão, misticismo e sinestesia', 'objetividade e descrição precisa', 'crítica social direta', 'humor e linguagem do cotidiano', 'nacionalismo indianista'], 'Os simbolistas queriam sugerir em vez de descrever. Usavam aliterações, sinestesias e temas espirituais. Cruz e Sousa é chamado de "Cisne Negro".'],
    ['A sinestesia, muito usada pelos simbolistas, é a figura que:', ['mistura sensações de sentidos diferentes, como em "voz doce"', 'exagera uma ideia', 'troca o autor pela obra', 'repete sons consonantais apenas', 'diz o contrário do que pensa'], '"Voz" é captada pela audição e "doce" pelo paladar: misturam-se os sentidos. Outro exemplo: "cheiro verde".']
  ],
  l13: [
    ['"Os Sertões", de Euclides da Cunha, obra pré-modernista, trata:', ['da Guerra de Canudos e da realidade do sertanejo', 'da vida na corte do Rio', 'de cavaleiros medievais', 'da Semana de Arte Moderna', 'da imigração italiana em São Paulo'], 'Euclides cobriu a guerra como jornalista e denunciou o massacre. A frase "O sertanejo é, antes de tudo, um forte" é famosa.'],
    ['Lima Barreto, em "Triste Fim de Policarpo Quaresma", critica:', ['o nacionalismo ingênuo e a República recém-proclamada', 'o indianismo romântico apenas', 'a corte de D. João VI', 'os parnasianos', 'a Revolução Francesa'], 'Policarpo é um nacionalista exagerado que acaba vítima do governo que defendia. Lima Barreto denunciava o racismo e as injustiças da Primeira República.']
  ],
  l14: [
    ['O Cubismo, vanguarda de Picasso, caracteriza-se por:', ['representar objetos por vários ângulos ao mesmo tempo, com formas geométricas', 'pintar sonhos e o inconsciente', 'exaltar a velocidade e as máquinas', 'usar cores fortes e puras sem compromisso com a realidade', 'negar toda lógica com o absurdo'], 'Cubismo: fragmentação e geometrização. Surrealismo: sonhos e inconsciente (Dalí). Futurismo: velocidade e máquinas. Fauvismo: cores fortes. Dadaísmo: absurdo e antiarte.'],
    ['O quadro "O Grito", de Edvard Munch, é um exemplo de qual vanguarda?', ['Expressionismo', 'Cubismo', 'Impressionismo', 'Futurismo', 'Realismo'], 'O Expressionismo deforma as figuras e usa cores intensas para expressar angústia e emoções interiores.']
  ],
  l15: [
    ['A Semana de Arte Moderna de 1922, em São Paulo, propunha:', ['romper com os padrões acadêmicos e buscar uma arte brasileira moderna', 'retomar o Parnasianismo', 'valorizar a arte europeia clássica', 'acabar com a literatura', 'defender a monarquia'], 'Mário de Andrade, Oswald de Andrade, Anita Malfatti e outros chocaram o público com verso livre, linguagem coloquial e humor.'],
    ['O "Manifesto Antropófago", de Oswald de Andrade, propunha:', ['"devorar" a cultura estrangeira e transformá-la em algo brasileiro', 'rejeitar completamente qualquer influência estrangeira', 'copiar fielmente a cultura europeia', 'voltar ao indianismo romântico', 'proibir a arte moderna'], 'A antropofagia cultural absorve o que vem de fora e recria com identidade nacional. "Tupi or not tupi, that is the question."']
  ],
  l16: [
    ['Carlos Drummond de Andrade, da 2ª geração modernista, escreveu "No meio do caminho tinha uma pedra". Sua poesia é marcada por:', ['reflexão sobre o cotidiano, o indivíduo e a sociedade, com ironia', 'idealização do indígena', 'perfeição formal parnasiana', 'misticismo simbolista', 'exaltação da vida no campo'], 'Drummond trata de temas como solidão, memória, Minas Gerais e as angústias do mundo moderno, em linguagem simples e profunda.'],
    ['Cecília Meireles, poeta da 2ª geração modernista, tem poesia marcada por:', ['musicalidade, delicadeza e reflexão sobre o tempo e a efemeridade', 'linguagem agressiva e politicamente panfletária', 'regionalismo nordestino', 'poesia concreta visual', 'humor e piadas'], 'Sua poesia intimista lembra o Simbolismo. "Romanceiro da Inconfidência" e "Ou isto ou aquilo" estão entre suas obras.']
  ],
  l17: [
    ['"Vidas Secas", de Graciliano Ramos, retrata:', ['uma família de retirantes fugindo da seca no sertão nordestino', 'a elite cafeeira paulista', 'a vida urbana no Rio de Janeiro', 'a colonização portuguesa', 'a imigração japonesa'], 'Fabiano, Sinhá Vitória, os meninos e a cachorra Baleia sofrem com a seca e a exploração. A linguagem seca e enxuta combina com o tema.'],
    ['O Romance de 30 se diferencia do regionalismo romântico por:', ['denunciar problemas sociais com realismo, em vez de idealizar', 'idealizar o sertanejo como herói perfeito', 'escrever em versos', 'tratar só da vida urbana', 'não ter personagens'], 'Rachel de Queiroz ("O Quinze"), Graciliano, Jorge Amado e José Lins do Rego mostraram a seca, a miséria e a exploração no Nordeste.']

function parseNum(s) {

}

  const opens = qs.filter(q => q.type === 'open');
  opens.filter(q => !(A[q.id] || '').trim()).forEach(q => { res[q.id] = { score: 0, feedback: 'Sem resposta. Leia a resposta modelo abaixo e tente explicar com suas palavras.' }; });

  QZ.graded = { res, report: null, pending: toGrade.length > 0, at: Date.now() };

    QZ_BUSY = true; render(); qzTick(true);

      const objSummary = qs.filter(q => q.type !== 'open').map(q => ({ topic: q.topic, acertou: res[q.id].score === 1 }));
      const user = 'Corrija as respostas discursivas de um aluno que está se preparando para o ENEM (' + QZ_LEVELS[QZ.level][0].toLowerCase() + '). Seja justo e gentil: aceite respostas certas escritas de outro jeito.\n' +

        '\nResponda em JSON: {"grades":[{"id":"q1","score":1,"feedback":"1 ou 2 frases: o que acertou e o que faltou"}],"report":{"summary":"2 frases de visão geral","review":[{"topic":"tema da lista","why":"a lacuna observada","how":"o que fazer para revisar, em 1 frase"}],"next":"1 frase com o próximo passo"}}. "score" vale 1 (correta), 0.5 (parcial) ou 0 (errada).';
      const out = await aiJSON('Você é um professor de cursinho pré-ENEM no Brasil que corrige respostas com cuidado. Responde somente com JSON válido, em português do Brasil.', user, GRADE_SCHEMA);
      (out.grades || []).forEach(g => { const q = toGrade.find(x => x.id === g.id); if (q) res[q.id] = { score: [0, 0.5, 1].includes(+g.score) ? +g.score : (+g.score >= 0.75 ? 1 : +g.score >= 0.25 ? 0.5 : 0), feedback: cleanMath(g.feedback || '') }; });
      QZ.graded.report = out.report || null;
      toGrade.forEach(q => { if (!res[q.id]) res[q.id] = { score: null, self: true }; });
    } catch (e) {
      toGrade.forEach(q => { res[q.id] = { score: null, self: true }; });
      QZ_STATUS = e.message === 'semchave' ? 'Compare sua resposta discursiva com a resposta modelo e marque como foi.' : 'A IA não conseguiu corrigir as discursivas agora (' + (QZ_ERR[e.message] || 'erro inesperado') + '). Compare sua resposta com a resposta modelo e marque como você foi.';

}

function qzAnswered() { return QZ.questions.filter(q => q.type === 'mc' ? QZ.answers[q.id] != null : (QZ.answers[q.id] || '').trim()).length; }
function qzReportHTML() {
  const g = QZ.graded, pct = Math.round(g.pts / QZ.questions.length * 100);

}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtMin = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min';
const fmtSec = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

const MONTH_FULL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const PHASES = { 1: 'Base: fundamentos do zero', 2: 'Núcleo do conteúdo', 3: 'Núcleo do conteúdo', 4: 'Núcleo do conteúdo', 5: 'Aprofundamento', 6: 'Revisão final e simulados' };

// ---------- datas (número de dias desde 1/1/1970, horário local) ----------
const D0 = new Date(1970, 0, 1);
const dnOf = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - D0) / 864e5);
const dateOfDn = n => new Date(1970, 0, 1 + n);
const dowOf = n => (dateOfDn(n).getDay() + 6) % 7; // 0 = segunda
const todayDn = () => dnOf(new Date());
const shortDate = n => { const d = dateOfDn(n); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
const longDate = n => { const d = dateOfDn(n); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const fullDate = n => { const d = dateOfDn(n); return DOW[dowOf(n)] + ', ' + d.getDate() + ' de ' + MONTH_FULL[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' de ' + d.getFullYear() : ''); };
function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fromISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function nextMonday(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); while (x.getDay() !== 1) x.setDate(x.getDate() + 1); return x; }
function snapMonday(d) { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }

const ATU_BY_THEME = THEMES.map(th => th[2] ? PLAN.atu.filter(v => new RegExp(th[2]).test(v.n)) : []);
function itemsOf(b) { return b.tracks ? b.tracks[S.lem] : b.items || []; }
function modsOfLesson(L) { const out = []; L.blocks.forEach(b => itemsOf(b).forEach(t => { if (t.mod && !out.includes(t.mod)) out.push(t.mod); })); return out; }
const bySubject = mods => mods.map((m, i) => [m, i]).sort((a, b) => AREA_ORDER.indexOf(a[0].s) - AREA_ORDER.indexOf(b[0].s) || a[1] - b[1]).map(x => x[0]);

}
function lessonItems(L) { return L.blocks.flatMap(b => b.s === 'REV' ? revItems(L) : itemsOf(b)).filter(t => t.min > 0); }

// ---------- agenda flexível ----------
// Regra: cada dia útil recebe a próxima aula que ainda não foi concluída. Aula com bolinha em branco no fim do dia
// passa para o próximo dia útil e todo o resto é empurrado. Sábado é revisão da semana, domingo é descanso.
let SCH = null;
function buildSchedule() {
  const startDn = dnOf(fromISO(S.start)), monDn = startDn - dowOf(startDn), tDn = todayDn(), pivot = Math.max(tDn, startDn);
  const info = LESSONS.map(L => {
    const its = lessonItems(L); let n = 0, mx = 0; const days = new Set();
    its.forEach(t => { const v = S.done[t.k]; if (v) { n++; mx = Math.max(mx, v); days.add(v); } });
    const complete = its.length > 0 && n === its.length;
    return { L, total: its.length, n, complete, doneDn: complete ? mx : null, days };
  });
  const cal = new Map();
  const ensure = dn => { if (!cal.has(dn)) cal.set(dn, { dn, dow: dowOf(dn), lessons: [], partial: [], adv: [] }); return cal.get(dn); };
  const lessonDn = new Array(NL).fill(null);
  info.forEach(x => {
    if (x.complete && x.doneDn < pivot) { lessonDn[x.L.li] = x.doneDn; if (x.doneDn >= startDn) ensure(x.doneDn).lessons.push(x.L); }
    else if (!x.complete) x.days.forEach(d => { if (d >= startDn && d < pivot) ensure(d).partial.push(x.L); });
  });
  const pending = info.filter(x => !(x.complete && x.doneDn < pivot));
  let qi = 0, dn = pivot, guard = 0, endDn = null, todayLi = null;
  ensure(pivot);
  while (qi < pending.length && guard++ < 3000) {
    const e = ensure(dn);
    while (qi < pending.length && pending[qi].complete && (dn > pivot || e.dow >= 5)) {
      const x = pending[qi++]; lessonDn[x.L.li] = x.doneDn; ensure(x.doneDn).adv.push(x.L);
    }
    if (qi < pending.length && e.dow < 5) {
      const x = pending[qi++]; e.lessons.push(x.L); lessonDn[x.L.li] = dn;
      if (dn === pivot) {
        todayLi = x.L.li;
        while (qi < pending.length && pending[qi].complete) { const y = pending[qi++]; e.adv.push(y.L); lessonDn[y.L.li] = y.doneDn; }
      }
    }
    dn++;
  }
  endDn = Math.max(...lessonDn.filter(v => v != null));
  const nextPending = info.find(x => !x.complete);
  // semanas do calendário e o que cai em cada sábado
  const lastDn = Math.max(endDn, tDn, monDn + 6);
  const nWeeks = Math.floor((lastDn - monDn) / 7) + 1;
  const weeks = [];
  let lastLi = -1, sims = 0, themes = 0;
  for (let c = 0; c < nWeeks; c++) {
    const ls = [];
    for (let d = 0; d < 7; d++) { const e = cal.get(monDn + c * 7 + d); if (e) [...e.lessons, ...e.adv].forEach(L => { if (!ls.includes(L)) ls.push(L); }); }
    ls.sort((a, b) => a.li - b.li);
    if (ls.length) lastLi = Math.max(lastLi, ls[ls.length - 1].li);
    const satDn = monDn + c * 7 + 5;
    const ref = ls.length ? lastLi : (nextPending && satDn >= tDn ? nextPending.L.li : lastLi);
    const sim = ref >= FINAL_LI;
    weeks.push({ c, lessons: ls, sim, simIdx: sim ? sims++ : null, themeIdx: sim ? null : themes++ });
  }
  // atraso em relação ao plano original
  let expected = 0; for (let d = startDn; d < pivot; d++) if (dowOf(d) < 5) expected++;
  const doneCount = info.filter(x => x.complete).length;
  SCH = { startDn, monDn, tDn, pivot, cal, info, lessonDn, endDn, weeks, todayLi, nextPending: nextPending ? nextPending.L.li : null, behind: Math.max(0, Math.min(expected, NL) - doneCount), doneCount };
  return SCH;
}
const entryOf = dn => SCH.cal.get(dn) || { dn, dow: dowOf(dn), lessons: [], partial: [], adv: [] };
const weekOf = dn => Math.floor((dn - SCH.monDn) / 7);
function modsOfWeekC(c) { const w = SCH.weeks[c]; const out = []; if (w) w.lessons.forEach(L => modsOfLesson(L).forEach(m => { if (!out.includes(m)) out.push(m); })); return bySubject(out); }

function satItems(c) {
  const wk = SCH.weeks[c] || { lessons: [], sim: false, themeIdx: 0 };
  const key = n => 's:c' + c + ':' + n;
  if (wk.sim) {

    return [

    ];
  }
  const mods = modsOfWeekC(c);
  const spaced = bySubject([...new Set([c - 1, c - 4].filter(x => x >= 0).flatMap(x => modsOfWeekC(x)))].filter(m => !mods.includes(m)));
  const ti = wk.themeIdx || 0;
  const th = ti < THEMES.length ? THEMES[ti] : EXTRA_THEMES[(ti - THEMES.length) % EXTRA_THEMES.length];
  const cortes = []; mods.forEach(m => (m.cortes || []).forEach(v => cortes.push(v)));
  const items = [
    { k: key(1), type: 's', title: 'Revisão da semana', txt: mods.length ? 'Para cada tema estudado nesta semana, escreva um resumo de 5 linhas sem consultar e revise os flashcards. Refaça as questões que errou.' : 'Nenhuma aula foi concluída nesta semana. Revise os flashcards e resumos das últimas aulas e, se der, adiante a próxima aula pendente.', mods, min: 90 },
    { k: key(2), type: 's', title: 'Questões do ENEM sobre os temas da semana', txt: 'Resolva 20 questões das provas anteriores (site do INEP) ligadas aos temas acima. Corrija e registre cada erro no caderno de erros.', link: ['INEP · Provas e gabaritos', GENERAL[0][2]], min: 60 },
    { k: key(3), type: 's', title: 'Revisão espaçada', txt: spaced.length ? 'Revise os flashcards e resumos destes temas de 1 e de 4 semanas atrás:' : 'Ainda não há semanas anteriores. Use o tempo para revisar os flashcards desta semana.', mods: spaced, min: 30 },
    { k: key(4), type: 's', title: 'Redação: ' + th[0], txt: (th[1] === 'treino' ? 'Tema de treino baseado em atualidades. ' : 'Tema oficial do ' + th[1] + '. ') + 'Planeje por 15 min (tese, 2 argumentos com repertório, proposta com agente, ação, meio, finalidade e detalhamento), escreva em 60 min e corrija pelas 5 competências da cartilha do INEP.', atu: ti < THEMES.length ? ATU_BY_THEME[ti] : [], min: 90 }

function keyIndex() {

  const n = Object.keys(S.done).length;
  if (n < 20 || (S.lastBackup && Date.now() - S.lastBackup < 14 * 864e5)) return '';
  return '<p class="note">Você ainda não ' + (S.lastBackup ? 'faz backup há mais de 2 semanas' : 'fez um backup do progresso') + '. <button class="linkbtn" data-xfer>Fazer backup agora</button></p>';
}
function goTransfer() { view = 'metodo'; try { history.replaceState(null, '', '#metodo'); } catch (e) {} render(); const t = document.getElementById('transferir'); if (t) t.scrollIntoView({ block: 'start' }); }

document.addEventListener('click', async e => {
  const t = e.target.closest('#xfer, [data-xfer], #x-link, #x-code, #x-merge, #x-replace, #x-down, #imp-merge, #imp-replace, #imp-cancel');
  if (!t) return;
  if (t.id === 'xfer' || t.hasAttribute('data-xfer')) { goTransfer(); return; }
  if (t.id === 'x-link' || t.id === 'x-code') {
    const code = await encodeProgress();
    const text = t.id === 'x-link' ? location.href.split('#')[0] + '#importar=' + code : code;
    markBackup();
    copyText(text, t.id === 'x-link' ? 'Link copiado. Envie para você mesmo e abra no outro aparelho.' : 'Código copiado. Cole no outro aparelho em "Receber de outro aparelho".');
    return;
  }
  if (t.id === 'x-merge' || t.id === 'x-replace') {
    const val = (document.getElementById('x-in') || {}).value || '';
    if (!val.trim()) { xmsg('Cole o código ou o link primeiro.', true); return; }
    try { const imp = await decodeProgress(val); const added = applyImport(imp, t.id === 'x-merge' ? 'merge' : 'replace'); goTransfer(); xmsg(t.id === 'x-merge' ? 'Progresso juntado: ' + Math.max(0, added) + ' tarefas novas marcadas.' : 'Progresso substituído.'); }
    catch (err) { xmsg(IMPORT_ERR[err.message] || IMPORT_ERR.formato, true); }
    return;
  }
  if (t.id === 'x-down') {
    const blob = new Blob([JSON.stringify({ app: 'cronograma-enem-2027', v: 2, start: S.start, exam: S.exam, lem: S.lem, t: S.t, done: S.done, quiz: S.quiz || [] }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'backup-cronograma-enem-' + toISO(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    markBackup(); goTransfer(); xmsg('Backup baixado. Guarde o arquivo em um lugar seguro.');
    return;
  }
  if (t.id === 'imp-merge' || t.id === 'imp-replace') {
    const added = applyImport(PENDING_IMPORT, t.id === 'imp-merge' ? 'merge' : 'replace');
    PENDING_IMPORT = null; clearImportHash();
    flash(t.id === 'imp-merge' ? 'Progresso juntado: ' + Math.max(0, added) + ' tarefas novas marcadas.' : 'Progresso substituído.');
    return;
  }
  if (t.id === 'imp-cancel') { PENDING_IMPORT = null; clearImportHash(); render(); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'x-file' || !e.target.files[0]) return;
  try { const imp = await decodeProgress(await e.target.files[0].text()); const added = applyImport(imp, 'merge'); goTransfer(); xmsg('Backup importado: ' + Math.max(0, added) + ' tarefas novas marcadas.'); }
  catch (err) { xmsg(IMPORT_ERR[err.message] || IMPORT_ERR.arquivo, true); }
});

// link de transferência: #importar=CÓDIGO
let PENDING_IMPORT = null;
function clearImportHash() { try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {} }
(async () => {
  let h = ''; try { h = location.hash; } catch (e) {}
  if (!h.startsWith('#importar=')) return;
  try {
    PENDING_IMPORT = await decodeProgress(h);
    const n = Object.keys(PENDING_IMPORT.done).length;
    const when = PENDING_IMPORT.t ? new Date(PENDING_IMPORT.t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
    view = 'hoje'; cur = null; render();
    $('#view').insertAdjacentHTML('afterbegin', '<div class="impbox"><p><b>Este link traz um progresso salvo' + (when ? ' em ' + when : '') + '</b> (' + n + ' tarefas marcadas).</p><div class="xbtns"><button class="btn" id="imp-merge" type="button">Juntar com este navegador</button><button class="btn ghost" id="imp-replace" type="button">Substituir o deste navegador</button><button class="btn ghost" id="imp-cancel" type="button">Ignorar</button></div></div>');
  } catch (err) { clearImportHash(); flash(IMPORT_ERR[err.message] || IMPORT_ERR.formato); }
})();

// ===== Sincronização automática entre aparelhos (PC, iPad, celular) pela conta do GitHub do aluno =====
// O progresso fica num gist privado da própria conta. Cada aparelho guarda um token que só tem permissão de "gist".
// Ao abrir ou voltar para a página, baixa; a cada mudança, envia. Vale o mais recente; se os dois aparelhos mudaram, junta.
// (com "var" e leitura preguiçosa: a primeira tela é desenhada pelo ui.js antes deste trecho rodar)
var GH, ghTimer = null, ghBusy = false, ghDirty = false;
var GH_FILE = 'cronograma-enem-2027.json';
var GH_ERR = { rede: 'Sem internet agora. Tente de novo quando estiver conectado.', token: 'O GitHub não aceitou o código. Confira se copiou inteiro (começa com "ghp_") ou gere outro.', permissao: 'O código não tem a permissão "gist". Gere outro pelo link do passo 1, que já vem com a permissão marcada.', http: 'O GitHub não respondeu. Tente de novo em instantes.', sumiu: 'O arquivo de sincronização foi apagado no GitHub. Ative a sincronização de novo.' };
function ghCfg() { if (GH === undefined) { try { GH = JSON.parse(localStorage.getItem('enem2027-github-sync') || 'null'); } catch (e) { GH = null; } } return GH; }
function ghOn() { const g = ghCfg(); return !inClaude() && !!(g && g.token && g.gist); }
function ghSave() { try { if (GH) localStorage.setItem('enem2027-github-sync', JSON.stringify(GH)); else localStorage.removeItem('enem2027-github-sync'); } catch (e) {} }
async function ghApi(path, opts, token) {
  let r;
  try { r = await fetch('https://api.github.com' + path, Object.assign({ cache: 'no-store' }, opts || {}, { headers: { Authorization: 'Bearer ' + (token || GH.token), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' } })); }
  catch (e) { throw new Error('rede'); }
  if (r.status === 401) throw new Error('token');
  if (r.status === 404 && /^\/gists\/\w+$/.test(path)) throw new Error('sumiu');
  if (r.status === 403 || r.status === 404) throw new Error('permissao');
  if (!r.ok) throw new Error('http');
  return r.json();
}
function ghState() { return { app: 'cronograma-enem-2027', v: 2, start: S.start, exam: S.exam, lem: S.lem, t: S.t, done: S.done, quiz: S.quiz || [] }; }
function ghQuiz(a, b) {
  const m = new Map();
  (a || []).concat(b || []).forEach(q => m.set([q.d, (q.topics || []).join('|'), q.pts, q.max].join('#'), q));
  return [...m.values()].sort((x, y) => (x.d < y.d ? -1 : x.d > y.d ? 1 : 0)).slice(-40);
}
async function ghRead() {
  const g = await ghApi('/gists/' + GH.gist);
  const f = g.files && g.files[GH_FILE];
  if (!f) return null;
  let c = f.content;
  if (f.truncated && f.raw_url) c = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  try { const o = JSON.parse(c); return o && o.done ? o : null; } catch (e) { return null; }
}
async function ghWrite() {
  await ghApi('/gists/' + GH.gist, { method: 'PATCH', body: JSON.stringify({ files: { [GH_FILE]: { content: JSON.stringify(ghState()) } } }) });
  GH.seen = S.t; GH.at = Date.now(); ghSave();
}
// o outro aparelho gravou e este não mudou nada: adota a versão de lá
function ghAdopt(r) {
  S = Object.assign({}, S, { start: r.start || S.start, exam: r.exam || S.exam, lem: r.lem || S.lem, done: Object.assign({}, r.done || {}), quiz: ghQuiz(S.quiz, r.quiz), t: r.t });
  saveLocal(); cur = null; render();
}
// os dois aparelhos mudaram desde a última sincronização: junta as marcações dos dois
function ghUnion(r) {
  const done = Object.assign({}, r.done || {});
  Object.entries(S.done).forEach(([k, v]) => { done[k] = done[k] ? Math.min(done[k], v) : v; });
  const newer = (r.t || 0) > (S.t || 0);
  S = Object.assign({}, S, { start: r.start && r.start < S.start ? r.start : S.start, exam: newer && r.exam ? r.exam : S.exam, lem: newer && r.lem ? r.lem : S.lem, done, quiz: ghQuiz(S.quiz, r.quiz), t: Math.max(S.t || 0, r.t || 0) + 1 });
  saveLocal(); cur = null; render();
}
async function ghSync() {
  if (!ghOn()) return;
  if (ghBusy) { ghDirty = true; return; }
  ghBusy = true; ghDirty = false; setSync('gh-saving');
  try {
    const r = await ghRead(), seen = GH.seen || 0, rt = r ? r.t || 0 : 0;
    const remoteChanged = !!r && rt !== seen, localChanged = (S.t || 0) !== seen;
    if (remoteChanged && localChanged) { ghUnion(r); await ghWrite(); }
    else if (remoteChanged) { ghAdopt(r); GH.seen = rt; GH.at = Date.now(); ghSave(); }
    else if (!r || localChanged) await ghWrite();
    else { GH.at = Date.now(); ghSave(); }
    setSync('gh');
  } catch (e) {
    setSync(e.message === 'token' || e.message === 'permissao' ? 'gh-token' : 'gh-off');
    if (e.message === 'sumiu') { GH.gist = null; ghSave(); setSync('local'); }
  }
  ghBusy = false;
  if (ghDirty) ghSync();
}
function ghTouch() { if (!ghOn()) return; setSync('gh-saving'); clearTimeout(ghTimer); ghTimer = setTimeout(() => { ghTimer = null; ghSync(); }, 2000); }
async function ghConnect(token) {
  const list = await ghApi('/gists?per_page=100', null, token);
  const found = (list || []).find(g => g.files && g.files[GH_FILE]);
  GH = { token, gist: found ? found.id : null, seen: 0, at: 0 };
  if (!GH.gist) {
    if (!S.t) S.t = Date.now();
    const g = await ghApi('/gists', { method: 'POST', body: JSON.stringify({ description: 'Progresso do Cronograma ENEM 2027 (sincronização automática entre aparelhos)', public: false, files: { [GH_FILE]: { content: JSON.stringify(ghState()) } } }) }, token);
    GH.gist = g.id; GH.seen = S.t; GH.at = Date.now(); ghSave(); saveLocal();
    return 'Sincronização ativada. Agora faça o mesmo no iPad com o mesmo código.';
  }
  ghSave();
  const before = Object.keys(S.done).length, r = await ghRead();
  if (r) ghUnion(r);
  await ghWrite();
  return 'Sincronização ativada e progresso dos aparelhos juntado (' + Math.max(0, Object.keys(S.done).length - before) + ' tarefas vieram do outro aparelho).';
}
function ghHTML() {
  if (inClaude()) return '';
  if (ghOn()) return `<div class="ghsync"><h3>Sincronização entre aparelhos</h3><p><b>Ativa neste aparelho.</b> Tudo o que você marcar aqui aparece no outro aparelho em poucos segundos (ao abrir ou voltar para a página). Última sincronização: ${GH.at ? new Date(GH.at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : 'agora'}.</p><div class="xbtns"><button class="btn" id="gh-now" type="button">Sincronizar agora</button><button class="btn ghost" id="gh-stop" type="button">Desligar neste aparelho</button></div></div>`;
  return `<div class="ghsync"><h3>Sincronizar PC e iPad automaticamente</h3>
<p>Configure uma vez em cada aparelho. Depois disso, o que você marcar no PC aparece no iPad e vice-versa, sozinho. O progresso fica guardado num arquivo privado da sua conta do GitHub.</p>
<ol class="steps">
<li>Abra <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Cronograma%20ENEM%202027" target="_blank" rel="noopener">este link do GitHub</a> (já vem com a permissão certa marcada, só "gist").</li>
<li>Em <b>Expiration</b>, escolha <b>No expiration</b>. Desça até o fim e clique em <b>Generate token</b>.</li>
<li>Copie o código que aparece (começa com "ghp_"; o GitHub só mostra uma vez) e cole aqui:</li>
</ol>
<div class="qzkey"><input type="password" id="gh-token" autocomplete="off" placeholder="Cole aqui o código ghp_…" aria-label="Código do GitHub"><button class="btn" type="button" id="gh-save">Ativar sincronização</button></div>
<p class="small">No iPad: abra o cronograma pelo ícone da tela de início, toque em "Sincronizar e backup" e cole o mesmo código. Para levar o código até o iPad, mande para você mesmo (Notas, WhatsApp ou e-mail) e apague a mensagem depois.</p>
<p class="small">O código só dá acesso aos gists (anotações) da sua conta, nada além disso. Não mostre para ninguém.</p></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('#gh-save, #gh-now, #gh-stop');
  if (!t) return;
  if (t.id === 'gh-save') {
    const token = ((document.getElementById('gh-token') || {}).value || '').trim().replace(/\s+/g, '');
    if (token.length < 20) { xmsg('Cole o código inteiro (começa com "ghp_").', true); return; }
    t.disabled = true; t.textContent = 'Ativando…';
    try { const msg = await ghConnect(token); setSync('gh'); goTransfer(); xmsg(msg); }
    catch (err) { GH = null; ghSave(); t.disabled = false; t.textContent = 'Ativar sincronização'; xmsg(GH_ERR[err.message] || GH_ERR.http, true); }
  } else if (t.id === 'gh-now') {
    await ghSync(); goTransfer();
    const m = document.getElementById('sync'); xmsg(m && m.dataset.mode === 'gh' ? 'Sincronizado agora.' : 'Não consegui sincronizar: ' + (m ? m.textContent : '') + '.', !(m && m.dataset.mode === 'gh'));
  } else if (t.id === 'gh-stop') {
    GH = null; ghSave(); setSync('local'); goTransfer(); xmsg('Sincronização desligada neste aparelho. O progresso continua salvo aqui.');
  }
});
if (!inClaude()) {
  if (ghOn()) setTimeout(ghSync, 500);
  document.addEventListener('visibilitychange', () => {
    if (!ghOn()) return;
    if (document.hidden) { if (ghTimer) { clearTimeout(ghTimer); ghTimer = null; ghSync(); } }
    else ghSync();
  });
  window.addEventListener('online', () => { if (ghOn()) ghSync(); });
  setInterval(() => { if (ghOn() && !document.hidden) ghSync(); }, 120000);
}

// pede ao navegador para não apagar os dados desta página
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => {}); } catch (e) {}

</script>
