<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Cronograma de estudos para o ENEM 2027: 130 aulas com os v&iacute;deos do Curso Enem Gratuito, exerc&iacute;cios, revis&otilde;es, reda&ccedil;&atilde;o, simulados e metodologia."><meta name="theme-color" content="#131A2A"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='6' fill='%23131A2A'/%3E%3Crect x='6' y='10' width='52' height='12' rx='6' fill='%23BE123C'/%3E%3Ccircle cx='22' cy='38' r='6' fill='%23fff'/%3E%3Ccircle cx='42' cy='38' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ENEM 2027"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Cronograma ENEM 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: folha de prova — cabeçalho fixo com a faixa das 26 semanas, conteúdo em coluna única larga, blocos do dia como questões numeradas com bolinhas de cartão-resposta */
:root {
  --paper: #EEF1F5; --sheet: #FFFFFF; --ink: #131A2A; --ink2: #4B5568; --line: #D6DCE5; --soft: #E6EAF0;
  --pen: #1D4ED8; --ok: #15803D;
  --lc: #C2410C; --ch: #6D3FC0; --cn: #0F766E; --mt: #BE123C; --rd: #8A5A00; --rv: #334155;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D121C; --sheet: #151C2A; --ink: #E8ECF3; --ink2: #A2ACBF; --line: #273246; --soft: #1C2536;
  --pen: #7FA6FF; --ok: #4ADE80; --lc: #FB9A5B; --ch: #B9A0FF; --cn: #4FD1C0; --mt: #FF7E9C; --rd: #E3B456; --rv: #A9B6CC; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0D121C; --sheet: #151C2A; --ink: #E8ECF3; --ink2: #A2ACBF; --line: #273246; --soft: #1C2536;
  --pen: #7FA6FF; --ok: #4ADE80; --lc: #FB9A5B; --ch: #B9A0FF; --cn: #4FD1C0; --mt: #FF7E9C; --rd: #E3B456; --rv: #A9B6CC; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: var(--pen); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
.a-lc { --c: var(--lc); } .a-ch { --c: var(--ch); } .a-cn { --c: var(--cn); } .a-mt { --c: var(--mt); } .a-rd { --c: var(--rd); } .a-rv { --c: var(--rv); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }

/* cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.toprow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; padding-block: 14px 10px; }
.brand { min-width: 0; flex: 1 1 260px; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
h1 { margin: 2px 0 0; font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.prog { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; flex: 1 1 320px; min-width: 0; }
#pct { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; grid-row: span 2; }
#pcount { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
#strip { display: grid; grid-template-columns: repeat(26, 1fr); gap: 3px; }
#strip i { display: block; height: 14px; border-radius: 3px; border: 1px solid var(--line); background: linear-gradient(to top, var(--ink) calc(var(--f) * 100%), transparent 0); }
#strip i.now { border-color: var(--pen); box-shadow: 0 0 0 1px var(--pen); }
.settings { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding-bottom: 10px; font-size: 14px; }
.settings label { display: inline-flex; align-items: center; gap: 6px; }
.settings input[type=date] { font: inherit; font-family: var(--mono); font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg label { padding: 3px 12px; cursor: pointer; gap: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--sheet); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--pen); outline-offset: -2px; }
.syncwrap { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
#sync { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
#xfer { font-size: 13px; }
/* backup e transferência */
.pointer { margin: 0; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--sheet); }
.xfer { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px 22px; margin-top: 8px; }
.xfer > div { min-width: 0; }
.xfer h3 { margin: 4px 0 6px; font-size: 16px; }
.xfer ol { margin: 0 0 8px; }
.xfer textarea { width: 100%; min-height: 70px; font: 12px/1.4 var(--mono); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); resize: vertical; }
.xbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.btn { font: inherit; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { opacity: .88; }
.filebtn { display: inline-block; font-size: 14px; color: var(--pen); text-decoration: underline; cursor: pointer; }
.filebtn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.filebtn:focus-within { outline: 2px solid var(--pen); outline-offset: 2px; }
.xmsg { margin: 6px 0 0; font-size: 14px; color: var(--ok); min-height: 1.2em; }
.xmsg.bad { color: var(--mt); }
.impbox { background: var(--sheet); border: 2px solid var(--pen); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.impbox p { margin: 0; }
#sync[data-mode=cloud]::before, #sync[data-mode=acc]::before { content: "● "; color: var(--ok); }
#sync[data-mode=saving]::before, #sync[data-mode=acc-saving]::before { content: "◐ "; color: var(--pen); }
#sync[data-mode=local]::before, #sync[data-mode=offline]::before, #sync[data-mode=acc-off]::before { content: "○ "; }
#sync[data-mode=acc-sessao]::before { content: "○ "; color: var(--mt); }
.ghsync { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; }
.ghsync h3 { margin-top: 0; }
.accform { display: grid; gap: 10px; max-width: 420px; margin-top: 10px; }
.accform label { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
.accform input { font: inherit; font-size: 16px; font-weight: 400; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.ghdevs { margin: 4px 0 10px; padding-left: 20px; font-size: 14.5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-family: var(--display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 15px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--ink2); padding: 8px 14px 9px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button:hover { color: var(--ink); }
#flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

main { padding-block: 22px 96px; }
.note { margin: 0 0 12px; font-size: 14px; color: var(--ink2); }
.linkbtn { font: inherit; color: var(--pen); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

/* dia */
.dayhead { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin-bottom: 18px; }
.dayhead h2 { margin: 2px 0 0; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.05; text-wrap: balance; }
.dh { min-width: 0; }
.nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
.nav:disabled { opacity: .35; cursor: default; }
.blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 14px; align-items: start; }
.block { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; }
.block.wide { max-width: 860px; }
.bhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bnum { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.chip { display: inline-block; font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--c); border: 1.5px solid var(--c); border-radius: 4px; padding: 1px 6px; line-height: 1.35; white-space: nowrap; }
.dur { margin-left: auto; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.block h3 { margin: 8px 0 2px; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.block h3 .sep { color: var(--ink2); font-weight: 400; }
.mtag { margin: 0 0 6px; font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.tasks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: 30px 1fr; gap: 6px; padding: 7px 0; border-top: 1px dashed var(--line); }
.task:first-child { border-top: 0; }
.tbody { min-width: 0; overflow-wrap: anywhere; }
.tmain { font-size: 15px; line-height: 1.35; }
.task.is-done .tmain { color: var(--ink2); }
.task.is-done .tmain a { color: var(--ink2); }
.kind { display: inline-block; font-family: var(--mono); font-size: 12px; color: var(--ink2); margin-top: 2px; }
.txt { display: block; font-size: 14px; color: var(--ink2); margin-top: 2px; }
.part { font-family: var(--mono); font-size: 12px; color: var(--ink2); font-weight: 400; }
.bub { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 1.75px solid var(--ink2); border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--sheet); transition: background .12s, border-color .12s; }
.bub::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .12s; }
.bub:checked { border-color: var(--ink); }
.bub:checked::after { transform: scale(1.3); }
.bub:hover { border-color: var(--ink); }
.alt { margin-top: 4px; font-size: 13.5px; }
.alt summary { cursor: pointer; color: var(--ink2); font-size: 13px; }
.alt ul, .modlist { margin: 4px 0 0; padding-left: 18px; }
.modlist { list-style: none; padding-left: 0; display: grid; gap: 4px; font-size: 14px; }
.modlist .chip { font-size: 11px; padding: 0 5px; }
.ext { display: inline-block; margin-top: 4px; font-size: 14px; }
.rep { margin-top: 4px; font-size: 14px; }
.deep { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink2); }
.deep span { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
.rest .txt { font-size: 15px; max-width: 65ch; }

/* semanas */
.month { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 10px; font-family: var(--display); font-stretch: 80%; font-weight: 700; font-size: 20px; text-transform: uppercase; }
.month:first-child { margin-top: 0; }
.month span { font-weight: 800; font-size: 26px; }
.week { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.wkhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wkhead h3 { margin: 0; font-family: var(--display); font-stretch: 80%; font-size: 19px; text-transform: uppercase; }
.wkdates { font-family: var(--mono); font-size: 13px; color: var(--ink2); }
.wkpct { margin-left: auto; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.wkdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.wkday { font: inherit; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 7px; cursor: pointer; color: var(--ink); display: grid; gap: 4px; min-width: 0; }
.wkday:hover { border-color: var(--ink2); }
.wkday.today { border-color: var(--pen); box-shadow: 0 0 0 1px var(--pen); }
.wkday.full { background: var(--soft); }
.dn { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.dlab { font-size: 12px; color: var(--ink2); }
.mini { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.mini b { display: block; height: 100%; background: var(--ink); }
.wkmods { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 5px 18px; font-size: 13px; color: var(--ink2); }
.wkmods li { min-width: 0; padding-left: 8px; border-left: 2px solid var(--c); }
.wkmods b { color: var(--c); font-weight: 700; }

/* matérias */
.lede { max-width: 70ch; color: var(--ink2); margin: 0 0 16px; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px; align-items: start; }
.subj { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.shead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.shead h2 { margin: 0; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: 24px; text-transform: uppercase; color: var(--c); }
.sarea { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.sbar { height: 6px; border-radius: 3px; background: var(--soft); margin: 10px 0 4px; overflow: hidden; }
.sbar b { display: block; height: 100%; background: var(--c); }
.snums { margin: 0 0 6px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.subj details { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.subj summary { cursor: pointer; font-weight: 700; font-size: 15px; }
.mods { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14.5px; }
.mods li::marker { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.mrow { display: flex; gap: 10px; justify-content: space-between; }
.mname { min-width: 0; }
.mwk { font-family: var(--mono); font-size: 12px; color: var(--ink2); white-space: nowrap; }
.mods .mtag { display: block; margin: 0; }
.mlinks { font-size: 13px; }
.badge { font-family: var(--mono); font-size: 11px; color: var(--c); border: 1px solid var(--c); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.res { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 9px; font-size: 14.5px; }
.res li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: baseline; }
.res li > div { min-width: 0; overflow-wrap: anywhere; }
.res p { margin: 1px 0 0; font-size: 13.5px; color: var(--ink2); }
.rtype { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border: 1px solid var(--line); border-radius: 3px; text-align: center; padding: 1px 0; }
.general { margin-top: 20px; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.general h2 { margin: 0; font-family: var(--display); font-stretch: 78%; font-size: 22px; text-transform: uppercase; }

/* método */
.prose { display: grid; gap: 14px; }
.prose section { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.prose h2 { margin: 0 0 8px; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: 22px; text-transform: uppercase; }
.prose p, .prose li { max-width: 75ch; }
.prose ol, .prose ul { padding-left: 22px; display: grid; gap: 6px; }
.small { font-size: 14px; color: var(--ink2); }
.tablewrap { overflow-x: auto; margin: 10px 0; }
.grid { border-collapse: collapse; font-size: 14px; min-width: 640px; }
.grid th, .grid td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.grid th { font-weight: 700; white-space: nowrap; }
.grid .chip { font-size: 11px; }
.matrix td:first-child { font-weight: 700; }
.themes { list-style: none; padding-left: 0 !important; columns: 2 320px; column-gap: 28px; display: block !important; }
.themes li { break-inside: avoid; margin-bottom: 6px; font-size: 14.5px; }
.themes .wk { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.phases li { max-width: 80ch; }

/* agenda flexível */
#forecast { margin: 0 0 8px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
#forecast b { color: var(--ink); font-weight: 700; }
#forecast.tight b, #forecast.tight { color: var(--rd); }
#forecast.bad, #forecast.bad b { color: var(--mt); }
.note.warn { color: var(--rd); }
.note.ok { color: var(--ok); }
.lesson { margin-bottom: 18px; }
.lhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 0 10px; }
.lnum { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 20px; text-transform: uppercase; }
.lmeta { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.lflag { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.lprog { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dayhead.single { grid-template-columns: 1fr; }
.howto { margin: 8px 0 0; font-size: 13px; }
.flag { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-radius: 3px; padding: 0 5px; border: 1px solid currentColor; }
.flag.now { color: var(--pen); } .flag.end { color: var(--ok); } .flag.lim { color: var(--mt); }
.week.past { opacity: .82; }
.wkday.gap { border-style: dashed; }
.wkday.future { background: var(--sheet); }
.aula { font-size: 12.5px; font-weight: 700; }
.note.recent, .note.backs { font-size: 14.5px; }
.note.studied .kind { margin: 0; }

/* aba aulas */
[hidden] { display: none !important; }
.aulas-top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 10px; }
.aulas-top input { flex: 1 1 280px; min-width: 0; font: inherit; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); color: var(--ink); }
.anums { font-family: var(--mono); font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.lgroup { flex-wrap: wrap; gap: 0 10px; }

function words(n) {
  return new Set(n.split('|')[0].replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => w.replace(/S$/, '')));
}
function similar(a, b) {
  if (!a.size || !b.size) return false;
  let inter = 0; a.forEach(w => { if (b.has(w)) inter++; });
  return inter / (a.size + b.size - inter) >= 0.7;
}
const reCache = new Map();
const RX = p => { if (!reCache.has(p)) reCache.set(p, new RegExp(p)); return reCache.get(p); };
function matchModule(s, n) {
  const mods = MODULES[s]; if (!mods) return null;
  for (let mi = 0; mi < mods.length; mi++) {
    const pats = mods[mi][3];
    for (let i = 0; i < pats.length; i++) if (RX(pats[i]).test(n)) return { mi, rank: i };
  }
  return null;
}
function kwSubject(n) { for (const [re, s] of KW) if (re.test(n)) return s; return null; }
const LVL_INTRO = /^O QUE (E|SAO)\b|INTRODUCAO|CONCEITOS? (BASICOS|INICIAIS|GERAIS)|COMO COMECAR|DEFINICAO|NOCOES|^ENTENDA|^COMO ESTUDAR|^O QUE E E COMO ESTUDAR|CARACTERISTICAS GERAIS|ASPECTOS GERAIS|VISAO GERAL/;
const LVL_PRACTICE = /EXERCICIO|RESOLUCAO|RESOLVID|QUESTAO|QUESTOES|ENEM 20\d\d|MACETE|TRUQUE|PEGADINHA|NA PRATICA|\bDICAS\b/;

function classify() {
  const C = {};
  Object.keys(MODULES).forEach(s => {
    C[s] = { mods: MODULES[s].map(([k, name, tag, pats, ex]) => ({ k, name, tag, ex: ex || {}, s, r: PROG_REQ[k] || [], vids: [], cortes: [] })), extra: { k: s.toLowerCase() + '-extra', name: 'Dicas, estratégias e questões comentadas', tag: '', ex: {}, s, r: [], vids: [], cortes: [] } };
  });
  const review = { aul: [], loose: [] }, atu = [], excluded = [];
  for (const v of VIDS) {
    v.n = N(v.t);
    if (v.s < 120 || EXCL.test(v.n)) { excluded.push(v); continue; }
    let s = CODE2S[v.c];
    for (const [re, to] of CROSS) if (re.test(v.n)) s = to;
    if (s === 'ATU') { atu.push(v); continue; }
    const contentCorte = ['ART', 'ING', 'ESP'].includes(v.c);
    if (s === 'AUL' || /AULAO/.test(v.n) || (REVIEW.test(v.n) && !contentCorte)) {
      const ks = kwSubject(v.n.split(/AULAO|AULOES/).pop()) || kwSubject(v.n) || s;
      v.rs = ks;
      if (/AULAO/.test(v.n) || v.s > 1500) { review.aul.push(v); continue; }
      const m = C[ks] && matchModule(ks, v.n);
      const cm = !m && CORTE_MAP.find(([p]) => RX(p).test(v.n));
      const cmod = cm && C[ks] && C[ks].mods.find(x => x.k === cm[1]);
      if (m) C[ks].mods[m.mi].cortes.push(v); else if (cmod) cmod.cortes.push(v); else review.loose.push(v);
      continue;
    }
    if (!C[s]) { excluded.push(v); continue; }
    const m = matchModule(s, v.n);
    if (m) { v.rank = m.rank; C[s].mods[m.mi].vids.push(v); }
    else { v.rank = 99; C[s].extra.vids.push(v); }
  }
  // ordem dentro do módulo + reforços opcionais (mesmo tema, outro professor)
  Object.values(C).forEach(sub => {
    sub.mods.push(sub.extra);
    sub.mods.forEach(m => {
      // do mais simples ao mais difícil: introdução → conteúdo (na ordem dos subtemas) → exercícios e questões do ENEM no fim
      m.vids.forEach(v => { v.lvl = LVL_PRACTICE.test(v.n) ? 2 : LVL_INTRO.test(v.n) ? 0 : 1; });
      m.vids.sort((a, b) => (a.lvl === 2) - (b.lvl === 2) || a.rank - b.rank || a.lvl - b.lvl || b.idx - a.idx);
      const main = [];
      for (const v of m.vids) {
        v.w = words(v.n);
        const twin = main.find(x => similar(x.w, v.w));
        if (twin) (twin.alt = twin.alt || []).push(v); else main.push(v);
      }
      // limite de minutos por módulo: mantém pelo menos um vídeo de cada subtema e manda o resto para "reforço opcional"
      const cap = CAP[m.s];
      if (cap && main.reduce((a, v) => a + v.s / 60, 0) > cap) {
        const groups = new Map();
        main.forEach(v => { if (!groups.has(v.rank)) groups.set(v.rank, []); groups.get(v.rank).push(v); });
        const keep = new Set(); let tot = 0;
        for (let r = 0; ; r++) {
          let any = false;
          for (const g of groups.values()) {
            const v = g[r]; if (!v) continue; any = true;
            if (r === 0 || tot + v.s / 60 <= cap) { keep.add(v); tot += v.s / 60; }
          }
          if (!any) break;
        }
        const kept = main.filter(v => keep.has(v)), extra = main.filter(v => !keep.has(v));
        if (kept.length && extra.length) { const last = kept[kept.length - 1]; last.alt = (last.alt || []).concat(extra); }
        m.main = kept;
      } else m.main = main;
    });
    sub.mods = sub.mods.filter(m => m.main.length || (m.ex.x && m.ex.x.length));
  });
  // ordem de estudo (pode ser diferente da ordem usada para classificar os vídeos)
  Object.keys(C).forEach(s => {
    const ord = PROG_ORDER[s];
    if (!ord) return;
    const pos = k => { const i = ord.indexOf(k); return i < 0 ? (/extra$/.test(k) ? 9999 : 5000) : i; };
    C[s].mods = C[s].mods.map((m, i) => [m, i]).sort((a, b) => pos(a[0].k) - pos(b[0].k) || a[1] - b[1]).map(x => x[0]);
  });
  // dicas e estratégias gerais só depois de todo o conteúdo da matéria
  Object.keys(C).forEach(s => {
    const ex = C[s].mods.find(m => /extra$/.test(m.k));
    if (ex) ex.r = C[s].mods.filter(m => m !== ex).map(m => m.k);
  });
  return { C, review, atu, excluded };
}

function buildPlan() {
  const { C, review, atu, excluded } = classify();

      (m.ex.x || []).forEach(x => { raw += x[2] / VIDEO_FACTOR; vmin += x[2]; });

    const f = Math.max(0.3, Math.min(1.5, (budget - vmin) / raw));

      m.main.forEach(v => {

  const reqOk = (m, dayI) => (m.r || []).every(k => !MODBYKEY[k] || (modDone[k] != null && (modDone[k] < dayI || (MODBYKEY[k].s === m.s && modDone[k] <= dayI))));
  const state = {};
  Object.keys(C).forEach(s => { state[s] = { mods: C[s].mods.slice(), cur: [], curMod: null, partN: {}, last: [] }; });
  const fillBlock = (s, b) => {
    const st = state[s], items = [], dayI = b.day.i, final = b.day.w >= CONTENT_WEEKS;
    let rem = b.min, blocked = false;
    while (rem > 0) {
      if (!st.cur.length) {
        // só pode adiantar um dos próximos 3 módulos da matéria, para não pular para temas avançados
        const idx = st.mods.slice(0, 3).findIndex(m => reqOk(m, dayI));
        if (idx < 0) { blocked = st.mods.length > 0; break; }
        st.curMod = st.mods.splice(idx, 1)[0];
        st.cur = st.curMod.tasks.slice();
      }
      const t = st.cur[0];
      if (t.min <= rem + 6) { items.push(t); rem -= t.min; st.cur.shift(); }
      else if (t.type === 'p' && rem >= 10) {
        st.partN[t.k] = (st.partN[t.k] || 0) + 1;
        const n = st.partN[t.k];
        items.push(Object.assign({}, t, { k: t.k + '#' + n, min: rem, part: n }));
        st.cur[0] = Object.assign({}, t, { min: t.min - rem });
        rem = 0;
      } else if (rem === b.min && t.type !== 'p') {
        // vídeo maior que o bloco: divide em partes
        const parts = Math.ceil(t.min / b.min), secPer = Math.ceil(t.v ? t.v.s / parts : 0);
        const pieces = [];
        for (let p = 0; p < parts; p++) pieces.push(Object.assign({}, t, { k: t.k + '@' + p, min: Math.ceil(t.min / parts), part: p + 1, parts, from: p * secPer, to: Math.min((p + 1) * secPer, t.v ? t.v.s : 0) }));
        items.push(pieces[0]);
        st.cur.splice(0, 1, ...pieces.slice(1));
        rem = 0;
      } else break;
      if (!st.cur.length && st.curMod) { modDone[st.curMod.k] = dayI; st.last.push(st.curMod); st.curMod = null; }
    }
    if (rem >= 10) {
      const exhausted = !st.mods.length && !st.cur.length;
      if (final && exhausted) {
        const fq = finalQueue(s);
        while (fq.length && rem >= 10) {
          const t = fq[0];
          if (t.type === 'v') { if (t.min <= rem + 6 || rem === b.min) { items.push(t); rem -= t.min; fq.shift(); } else break; }
          else { items.push(Object.assign({}, t, { min: Math.min(t.min, rem) })); rem -= Math.min(t.min, rem); fq.shift(); }
        }
      }
      if (rem >= 10) {
        if (blocked) {
          const next = st.mods[0];
          const missing = (next.r || []).filter(k => MODBYKEY[k] && !(modDone[k] != null && modDone[k] < dayI)).map(k => MODBYKEY[k]);
          const recent = st.last.slice(-2);
          items.push({ k: 'c:' + s + ':' + dayI, type: 'f', s, title: 'Consolidação de ' + SUBJECTS[s].n, txt: 'O próximo tema (' + next.name + ') precisa de ' + missing.map(m => SUBJECTS[m.s].n + ': ' + m.name).join('; ') + ', que vem em breve na agenda. Use este tempo para refazer os exercícios e questões do ENEM dos últimos temas' + (recent.length ? ': ' + recent.map(m => m.name).join(' · ') : '') + '.', min: rem, mods: recent });
        } else items.push({ k: 'f:' + s + ':' + dayI, type: 'f', s, title: final ? 'Questões ENEM de ' + SUBJECTS[s].n + ' (provas do INEP)' : 'Prática livre de ' + SUBJECTS[s].n, txt: final ? 'Resolva questões de anos anteriores e revise o caderno de erros.' : 'Conteúdo da matéria em dia. Use o tempo para questões do ENEM dos temas já vistos e para o caderno de erros.', min: rem });
      }
    }
    return items;
  };
  days.forEach(day => {
    if (day.type !== 'study') return;
    TEMPLATE[day.d].forEach(([s, min]) => {
      const b = { s, min, items: [], mods: [], day };
      day.blocks.push(b);
      if (s === 'REV') return;
      if (s === 'LEM') { b.tracks = { ING: fillBlock('ING', b), ESP: fillBlock('ESP', b) }; b.items = null; }
      else b.items = fillBlock(s, b);
    });
  });
  const unscheduled = {};
  Object.keys(state).forEach(s => { const n = state[s].mods.length + (state[s].cur.length ? 1 : 0); if (n) unscheduled[s] = n; });

  // módulos por dia (para revisões) e primeira semana de cada módulo
  const modWeeks = {};
  days.forEach(day => day.blocks.forEach(b => {
    const lists = b.tracks ? [['ING', b.tracks.ING], ['ESP', b.tracks.ESP]] : [[b.s, b.items || []]];
    lists.forEach(([s, items]) => items.forEach(t => {
      if (!t.mod) return;
      const key = t.mod.k;
      if (!modWeeks[key]) modWeeks[key] = { first: day.w, last: day.w, mod: t.mod, s };
      modWeeks[key].last = day.w;
      if (!b.mods.includes(t.mod)) b.mods.push(t.mod);
      day.mods.add(t.mod);
    }));
  }));
  return { C, days, stats, modWeeks, review, atu, excluded, aulBy, unscheduled };
}

<p class="small">Por que reler engana: o texto parece familiar e dá a sensação de que você sabe. Na prova, você precisa <i>buscar</i> a informação na memória sem o texto na frente, e isso só se treina tentando lembrar.</p></section>

<section id="met-dia"><h2>O estudo do dia a dia, passo a passo</h2>
<ol class="steps">
<li><b>Prepare o ambiente (5 min).</b> Celular em outro cômodo ou no modo avião, água por perto, caderno, caderno de erros e a aba Hoje aberta.</li>
<li><b>Bloco de revisão ativa (20 min).</b> Sem olhar nada, escreva numa folha tudo o que lembra da aula anterior. Depois abra o caderno, confira e complete com outra cor. Faça os flashcards do Anki do dia.</li>
<li><b>Blocos de matéria.</b> Siga o protocolo de 5 passos descrito em "Cada bloco". Entre um bloco e outro, faça 10 minutos de pausa longe da tela (fora das 5 horas).</li>
<li><b>Feche o dia (10 min).</b> Marque as bolinhas do que fez, anote no caderno de erros o que ficou pendente e olhe rapidamente a aula de amanhã.</li>
<li><b>Durma de 7 a 9 horas.</b> É durante o sono que o cérebro consolida o que você estudou.</li>
</ol>
<div class="tablewrap"><table class="grid sched"><thead><tr><th>Exemplo de manhã</th><th>Exemplo de noite (para quem trabalha)</th><th>O que fazer</th></tr></thead><tbody>
<tr><td>07:30–07:50</td><td>18:00–18:20</td><td>Revisão ativa + Anki</td></tr>
<tr><td>08:00–09:35</td><td>18:30–20:05</td><td>Bloco 2 (matéria mais difícil do dia)</td></tr>
<tr><td>09:45–11:15</td><td>20:15–21:45</td><td>Bloco 3</td></tr>
<tr><td>11:15–11:35</td><td>21:45–22:00</td><td>Pausa maior (lanche, alongar)</td></tr>
<tr><td>11:35–13:30</td><td>22:00–23:50</td><td>Blocos 4, 5 e 6 com pausas de 10 min</td></tr>
</tbody></table></div>
<p class="small">Num dia ruim, faça o mínimo: a revisão ativa e um bloco. Marque o que fez; a agenda empurra o resto sozinha.</p></section>

<section id="met-bloco"><h2>Protocolo de cada bloco (5 passos)</h2>
<ol class="steps">
<li><b>Prever (2 min).</b> Leia o nome do módulo e escreva o que você já sabe e duas perguntas que espera responder.</li>
<li><b>Assistir com anotações.</b> Vídeo com caderno aberto, pausando para anotar com suas palavras (veja "Anotações"). O tempo previsto no cronograma já inclui essas pausas.</li>
<li><b>Recuperar (5 min).</b> Feche o vídeo e o caderno. Explique em voz alta ou por escrito o que aprendeu, como se ensinasse alguém (técnica de Feynman). Onde travar, volte só naquele ponto.</li>
<li><b>Praticar.</b> Faça a tarefa de exercícios do módulo. Corrija logo em seguida.</li>
<li><b>Registrar (3 min).</b> Cada erro vai para o caderno de erros. Crie de 3 a 5 flashcards com o que é essencial.</li>
</ol></section>

<section id="met-notas"><h2>Como anotar: método Cornell</h2>
<p>Divida a página em três partes. Na coluna da direita (larga), as anotações durante o vídeo. Na coluna da esquerda (estreita), escreva depois as perguntas que aquelas anotações respondem. No rodapé, um resumo de 2 linhas.</p>
<p>Para revisar, cubra a coluna da direita e tente responder as perguntas da esquerda. Isso transforma o caderno numa ferramenta de autoteste.</p>
<p class="small">Use desenhos, setas e tabelas sempre que puder. Não copie tudo o que o professor fala: anote ideias, exemplos e o que você não sabia.</p></section>

<section id="met-fix"><h2>Exercícios de fixação</h2>

<p><b>Onde achar questões gratuitas:</b> <a href="https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem/provas-e-gabaritos" target="_blank" rel="noopener">provas e gabaritos do INEP</a> (a melhor fonte), <a href="https://pt.khanacademy.org/" target="_blank" rel="noopener">Khan Academy</a> (Matemática e Ciências, com correção), <a href="https://portaldaobmep.impa.br/" target="_blank" rel="noopener">Portal da OBMEP</a> (Matemática, com resolução em vídeo), e as páginas de exercícios com gabarito do <a href="https://brasilescola.uol.com.br/" target="_blank" rel="noopener">Brasil Escola</a> e do <a href="https://www.todamateria.com.br/" target="_blank" rel="noopener">Toda Matéria</a>.</p></section>

<section id="met-rev"><h2>O sistema de revisões</h2>
<p>A memória cai rápido nos primeiros dias depois do estudo. Cada revisão feita no momento certo faz o conteúdo durar mais. O cronograma usa quatro camadas:</p>
<div class="layers">
<div><b>1 dia depois</b><span>Bloco de revisão ativa no início de cada aula.</span></div>
<div><b>1 semana depois</b><span>Sábado: resumo de cada tema, questões do ENEM e flashcards.</span></div>
<div><b>4 semanas depois</b><span>Sábado: revisão espaçada dos temas de 1 e de 4 semanas atrás.</span></div>
<div><b>Todo dia</b><span>Anki: o aplicativo mostra cada cartão no intervalo certo.</span></div>
</div>
<h3>Caderno de erros</h3>
<p>Uma página por matéria. Para cada questão errada, anote: tema, fonte da questão, <b>por que errou</b> (não sabia o conteúdo, não entendeu o enunciado, errou a conta, distração, faltou tempo) e a explicação certa com suas palavras. Todo sábado, refaça as questões do caderno sem olhar a resposta. Quando acertar a mesma questão em duas revisões seguidas, risque.</p>
<p class="small">O motivo do erro importa: errar por interpretação pede mais leitura de enunciados; errar por conteúdo pede voltar ao módulo; errar por distração pede conferir a pergunta antes de marcar.</p></section>

<section id="met-cards"><h2>Flashcards que funcionam</h2>
<ul>
<li><b>Uma informação por cartão.</b> "Qual organela produz ATP?" é melhor que "Fale sobre as organelas".</li>
<li><b>Em forma de pergunta</b>, não de frase solta.</li>
<li><b>Use lacunas:</b> "A unidade de potência no SI é o ___".</li>
<li><b>Use imagens</b> em Biologia, Química Orgânica, Geografia e Artes.</li>
<li><b>Evite listas longas</b> no verso. Quebre em vários cartões.</li>
<li><b>Escreva com suas palavras</b> e só depois de entender o conteúdo.</li>
<li><b>Seja honesto</b> ao avaliar se lembrou. Errar no Anki é o que faz ele funcionar.</li>
</ul>
<p class="small">Sem Anki, use o sistema de Leitner: 5 caixas de papel. Acertou, o cartão vai para a caixa seguinte (revisada com menos frequência); errou, volta para a caixa 1. Revise a caixa 1 todo dia, a 2 a cada 2 dias, a 3 uma vez por semana, a 4 a cada 2 semanas e a 5 uma vez por mês.</p></section>

<section id="met-prova"><h2>Na hora da prova</h2>
<h3>Como a nota é calculada (TRI)</h3>
<ul>
<li>O INEP usa a Teoria de Resposta ao Item. Cada questão tem um nível de dificuldade, e a nota considera a <b>coerência</b> dos seus acertos.</li>
<li>Quem acerta questões difíceis mas erra fáceis ganha menos pontos, porque o sistema entende que os acertos difíceis podem ter sido chute. Por isso, garanta as fáceis.</li>
<li>Não existe desconto por erro, e questão em branco conta como erro. Nunca deixe questão em branco.</li>
</ul>
<h3>Estratégia</h3>
<ol class="steps">
<li><b>Primeira volta:</b> resolva as questões que você sabe e marque as difíceis para depois. Não gaste mais de 4 minutos numa questão.</li>
<li><b>Segunda volta:</b> volte às marcadas, eliminando alternativas.</li>
<li><b>Reserve 20 minutos</b> para passar o gabarito para o cartão-resposta e marcar o que faltou.</li>
<li><b>Leia o comando antes do texto</b> nas questões longas.</li>
</ol>
<div class="tablewrap"><table class="grid"><thead><tr><th>Dia</th><th>Conteúdo</th><th>Tempo</th><th>Referência</th></tr></thead><tbody>
<tr><td>1º dia</td><td>Linguagens (45) + Humanas (45) + Redação</td><td>5h30</td><td>cerca de 1h10 para a redação e 2,5 min por questão</td></tr>
<tr><td>2º dia</td><td>Natureza (45) + Matemática (45)</td><td>5h</td><td>cerca de 3 min por questão</td></tr>
</tbody></table></div>
<p class="small">Use os simulados das semanas finais para testar a ordem que funciona melhor para você (por exemplo, fazer a redação no começo, com a cabeça descansada, ou depois das questões).</p></section>

<section id="met-saude"><h2>Constância e saúde</h2>
<ul>
<li><b>Sono:</b> 7 a 9 horas. Virar a noite estudando piora a memória do dia seguinte.</li>
<li><b>Exercício:</b> 20 a 30 minutos de caminhada ou outra atividade na maioria dos dias melhora atenção e humor.</li>
<li><b>Celular:</b> fora do alcance durante os blocos. Notificação no meio do bloco quebra a concentração.</li>
<li><b>Quando atrasar:</b> não tente compensar estudando 10 horas num dia. A agenda empurra as aulas sozinha e mostra se você continua dentro do limite.</li>
<li><b>Ansiedade:</b> ansiedade antes de provas é comum. Respiração lenta (inspirar em 4 tempos, soltar em 6) ajuda. Se estiver atrapalhando o sono ou o dia a dia, procure a unidade básica de saúde do seu bairro ou o CVV (ligue 188, gratuito, 24 horas).</li>
<li><b>Motivação:</b> compare você com você mesmo. Olhe a barra de progresso e as notas dos simulados ao longo dos meses.</li>
</ul></section>

<section id="met-erros"><h2>Erros comuns de quem recomeça</h2>
<ul>
<li>Só assistir vídeos e nunca fazer exercícios.</li>
<li>Reler e grifar no lugar de se testar.</li>
<li>Pular as revisões porque "já entendi".</li>
<li>Estudar só as matérias de que gosta.</li>
<li>Deixar a redação para depois.</li>
<li>Não corrigir os exercícios ou não anotar os erros.</li>
<li>Ficar meses sem fazer uma prova completa do ENEM.</li>
</ul></section>

<section id="met-fontes"><h2>Fontes</h2>
<ul class="small">
<li>Dunlosky, J. e outros (2013). Improving students' learning with effective learning techniques. <i>Psychological Science in the Public Interest</i>, 14(1), 4–58. <a href="https://doi.org/10.1177/1529100612453266" target="_blank" rel="noopener">doi.org/10.1177/1529100612453266</a></li>
<li>Roediger, H. L. e Karpicke, J. D. (2006). Test-enhanced learning: taking memory tests improves long-term retention. <i>Psychological Science</i>, 17(3), 249–255.</li>

<li>Diekelmann, S. e Born, J. (2010). The memory function of sleep. <i>Nature Reviews Neuroscience</i>, 11, 114–126.</li>

</ul></section>

// stem leve em português: tira acento, plural e a vogal final, fica com até 8 letras (igual ao índice gerado pela ferramenta)
const QSTOP = new Set('a o e de da do das dos em no na nos nas um uma uns umas para por com sem que se ao aos as os ou sua seu suas seus como mais menos entre sobre esse essa este esta isso isto nao sao foi ser ter tem pelo pela pelos pelas qual quais ja ate quando onde muito muitos muita muitas tambem nesse nessa neste nesta desse dessa deste desta texto questao questoes enem'.split(' '));
function qStem(w) {
  if (w.length > 4) w = w.replace(/(oes|aes)$/, 'ao');
  if (w.length > 4) w = w.replace(/ais$/, 'al');
  if (w.length > 5) w = w.replace(/eis$/, 'el');
  w = w.replace(/ns$/, 'm');
  if (w.length > 3) w = w.replace(/s$/, '');
  if (w.length > 4) w = w.replace(/[aoe]$/, '');
  return w.length > 8 ? w.slice(0, 8) : w;
}
function qTokens(s) { return N(String(s)).toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' ').filter(w => w.length > 1 && !QSTOP.has(w)).map(qStem); }
function qPhrases(list) { return list.map(p => qTokens(p)).filter(t => t.length); }

let QDB = null, QDB_P = null, QDB_ERR = '';
function loadQDB() {
  if (QDB) return Promise.resolve(QDB);
  if (!QDB_P) QDB_P = fetch(QBASE + 'index.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(j => {
    // q: [id, ano, dia, número, idioma, área, largura, altura, gabarito, palavras, página, extras]
    QDB = j.q.map(a => ({ id: a[0], y: a[1], d: a[2], n: a[3], l: a[4], a: a[5], w: a[6], h: a[7], g: a[8], tk: new Set(a[9].split(' ')), pg: a[10], fl: a[11] || '' }));
    QDB.src = j.src || {};
    QDB.byId = new Map(QDB.map(q => [q.id, q]));
    return QDB;
  }).catch(e => { QDB_P = null; QDB_ERR = e.message; throw e; });
  return QDB_P;
}
// questões que têm todas as palavras de pelo menos uma das frases
function qMatch(phrases, opt = {}) {
  const res = [];
  QDB.forEach(q => {
    if (opt.areas && q.a && !opt.areas.includes(q.a)) return;
    if (opt.lang && q.l && q.l !== opt.lang) return;
    if (opt.noOld && q.y < 2009) return;
    let hits = 0;
    phrases.forEach(ph => { if (ph.every(t => q.tk.has(t))) hits += ph.length; });
    if (hits) res.push({ q, s: hits });
  });
  return res.sort((a, b) => b.s - a.s || b.q.y - a.q.y || a.q.n - b.q.n).map(x => x.q);
}
function modPhrases(m) { return qPhrases([m.name].concat(QTOPICS[m.k] || [], QEXTRA[m.k] || [])); }
function qSearchText(text) {
  const t = qTokens(text);
  if (!t.length) return [];
  // se o que foi digitado é o nome de um tema do cronograma, inclui as palavras desse tema
  const mods = [];
  Object.values(PLAN.C).forEach(sub => sub.mods.forEach(m => { if (/extra$/.test(m.k)) return; const nm = qTokens(m.name + ' ' + (QTOPICS[m.k] || []).join(' ')); if (t.every(w => nm.includes(w))) mods.push(m); }));
  const direct = qMatch([t], { lang: S.lem === 'ESP' ? 'esp' : 'ing' });
  const extra = mods.length && mods.length <= 2 ? qMatch(mods.flatMap(m => qPhrases(QEXTRA[m.k] || [])), { areas: [...new Set(mods.map(m => SUBJ_AREA[m.s]))], lang: S.lem === 'ESP' ? 'esp' : 'ing' }) : [];
  const seen = new Set(direct.map(q => q.id));
  return direct.concat(extra.filter(q => !seen.has(q.id)));
}

const byRecent = (a, b) => b.y - a.y || a.n - b.n;
// questões de um tema do cronograma
function modQuestions(m) {
  const lang = S.lem === 'ESP' ? 'esp' : 'ing';
  if (m.s === 'RED') return [];
  // língua estrangeira: o ENEM cobra leitura, não um ponto de gramática; vale qualquer questão do idioma
  if (m.s === 'ING' || m.s === 'ESP') { const l = m.s === 'ING' ? 'ing' : 'esp'; return QDB.filter(q => q.l === l).sort(byRecent); }
  // "dicas e questões comentadas" da matéria: questões da área inteira, das mais recentes para as mais antigas
  if (/extra$/.test(m.k) || m.k === 'm39') return QDB.filter(q => q.a === SUBJ_AREA[m.s] && (!q.l || q.l === lang)).sort(byRecent);
  return qMatch(modPhrases(m), { areas: [SUBJ_AREA[m.s]], lang });
}
function uniqQ(lists) { const seen = new Set(), out = []; lists.forEach(l => l.forEach(q => { if (!seen.has(q.id)) { seen.add(q.id); out.push(q); } })); return out; }

  const bub = ['A', 'B', 'C', 'D', 'E'].map(L => {
    const cls = show && q.g === L ? ' right' : show && mine === L && q.g !== L ? ' wrong' : '';
    return '<button class="qalt' + (mine === L ? ' on' : '') + cls + '" data-qans="' + esc(q.id) + '" data-l="' + L + '" aria-pressed="' + (mine === L) + '">' + L + '</button>';
  }).join('');
  const notes = [];
  if (q.fl.includes('p')) notes.push('Esta questão usa o texto ou a figura da questão anterior, que aparece junto, no alto da imagem.');
  if (q.fl.includes('s')) notes.push('O texto ou a figura do início vale para mais de uma questão; por isso aparece aqui também.');
  return '<article class="qcard"><div class="qhead"><span class="qnum">' + (i + 1) + '</span><span class="qmeta">' + esc(qLabel(q)) + '</span></div>' +
    (notes.length ? '<p class="qnote">' + notes.join(' ') + '</p>' : '') +
    '<div class="qimg"><a href="' + QBASE + 'img/' + q.y + '/' + q.id + '.webp" target="_blank" rel="noopener" title="Abrir a imagem em tamanho grande"><img loading="lazy" src="' + QBASE + 'img/' + q.y + '/' + q.id + '.webp" width="' + q.w + '" height="' + q.h + '" style="max-width:min(100%,' + Math.round(q.w * 1.15) + 'px);margin:0 auto" alt="Questão ' + q.n + ' do ENEM ' + q.y + '"></a></div>' +
    '<div class="qans"><span>Sua resposta:</span>' + bub + '</div>' +
    '<p class="qsrc">' + qPdfLink(q) + '</p></article>';
}
function qGabHTML(list) {

const fmtMin = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? String(m % 60).padStart(2, '0') : '') : m + ' min';

const cleanTitle = t => { const p = t.split(/ ?\| ?/).map(x => x.trim()).filter(Boolean); if (!p.length) return t; return p[0].length < 14 && p[1] ? p[0] + ' · ' + p[1] : p[0]; };
const MONTH_FULL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const D0 = new Date(1970, 0, 1);
const dnOf = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - D0) / 864e5);
const dateOfDn = n => new Date(1970, 0, 1 + n);
const dowOf = n => (dateOfDn(n).getDay() + 6) % 7; // 0 = segunda

const shortDate = n => { const d = dateOfDn(n); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); };
const longDate = n => { const d = dateOfDn(n); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); };
const fullDate = n => { const d = dateOfDn(n); return DOW[dowOf(n)] + ', ' + d.getDate() + ' de ' + MONTH_FULL[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' de ' + d.getFullYear() : ''); };
function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fromISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function nextMonday(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); while (x.getDay() !== 1) x.setDate(x.getDate() + 1); return x; }

const ATU_BY_THEME = THEMES.map(th => th[2] ? PLAN.atu.filter(v => new RegExp(th[2]).test(v.n)) : []);
function itemsOf(b) { return b.tracks ? b.tracks[S.lem] : b.items || []; }
function modsOfLesson(L) { const out = []; L.blocks.forEach(b => itemsOf(b).forEach(t => { if (t.mod && !out.includes(t.mod)) out.push(t.mod); })); return out; }
const bySubject = mods => mods.map((m, i) => [m, i]).sort((a, b) => AREA_ORDER.indexOf(a[0].s) - AREA_ORDER.indexOf(b[0].s) || a[1] - b[1]).map(x => x[0]);
function revItems(L) {
  if (L.li === 0) return [{ k: 'r:0', type: 'r', title: 'Primeiro dia: prepare o sistema de estudo', txt: 'Separe um caderno de erros (uma página por matéria), instale o Anki no celular ou computador e leia a aba "Método" desta página.', min: 20 }];

function lessonItems(L) { return L.blocks.flatMap(b => b.s === 'REV' ? revItems(L) : itemsOf(b)).filter(t => t.min > 0); }

// ---------- agenda flexível ----------
// Regra: cada dia útil recebe a próxima aula que ainda não foi concluída. Aula com bolinha em branco no fim do dia
// passa para o próximo dia útil e todo o resto é empurrado. Sábado é revisão da semana, domingo é descanso.
let SCH = null;
function buildSchedule() {
  const startDn = dnOf(fromISO(S.start)), monDn = startDn - dowOf(startDn), tDn = todayDn(), pivot = Math.max(tDn, startDn);
  const info = LESSONS.map(L => {
    const its = lessonItems(L); let n = 0, mx = 0; const days = new Set();
    its.forEach(t => { const v = S.done[t.k]; if (v) { n++; mx = Math.max(mx, v); days.add(v); } });
    const complete = its.length > 0 && n === its.length;
    return { L, total: its.length, n, complete, doneDn: complete ? mx : null, days };
  });
  const cal = new Map();
  const ensure = dn => { if (!cal.has(dn)) cal.set(dn, { dn, dow: dowOf(dn), lessons: [], worked: [], adv: [] }); return cal.get(dn); };
  const lessonDn = new Array(NL).fill(null);
  info.forEach(x => {
    if (x.complete && x.doneDn < pivot) { lessonDn[x.L.li] = x.doneDn; if (x.doneDn >= startDn) ensure(x.doneDn).lessons.push(x.L); }
    // todo dia em que alguma tarefa da aula foi marcada (aula concluída em vários dias aparece em todos eles)
    x.days.forEach(d => ensure(d).worked.push(x.L));
  });
  const pending = info.filter(x => !(x.complete && x.doneDn < pivot));
  let qi = 0, dn = pivot, guard = 0, endDn = null, todayLi = null;
  ensure(pivot);
  while (qi < pending.length && guard++ < 3000) {
    const e = ensure(dn);
    while (qi < pending.length && pending[qi].complete && (dn > pivot || e.dow >= 5)) {
      const x = pending[qi++]; lessonDn[x.L.li] = x.doneDn; ensure(x.doneDn).adv.push(x.L);
    }
    if (qi < pending.length && e.dow < 5) {
      const x = pending[qi++]; e.lessons.push(x.L); lessonDn[x.L.li] = dn;
      if (dn === pivot) {
        todayLi = x.L.li;
        while (qi < pending.length && pending[qi].complete) { const y = pending[qi++]; e.adv.push(y.L); lessonDn[y.L.li] = y.doneDn; }
      }
    }
    dn++;
  }
  endDn = Math.max(...lessonDn.filter(v => v != null));
  const nextPending = info.find(x => !x.complete);
  // semanas do calendário e o que cai em cada sábado
  const lastDn = Math.max(endDn, tDn, monDn + 6);
  const nWeeks = Math.floor((lastDn - monDn) / 7) + 1;
  const weeks = [];
  let lastLi = -1, sims = 0, themes = 0;
  for (let c = 0; c < nWeeks; c++) {
    const ls = [];
    for (let d = 0; d < 7; d++) { const e = cal.get(monDn + c * 7 + d); if (e) [...e.lessons, ...e.adv].forEach(L => { if (!ls.includes(L)) ls.push(L); }); }
    ls.sort((a, b) => a.li - b.li);
    if (ls.length) lastLi = Math.max(lastLi, ls[ls.length - 1].li);
    const satDn = monDn + c * 7 + 5;
    const ref = ls.length ? lastLi : (nextPending && satDn >= tDn ? nextPending.L.li : lastLi);
    const sim = ref >= FINAL_LI;
    weeks.push({ c, lessons: ls, sim, simIdx: sim ? sims++ : null, themeIdx: sim ? null : themes++ });
  }
  // atraso em relação ao plano original
  let expected = 0; for (let d = startDn; d < pivot; d++) if (dowOf(d) < 5) expected++;
  const doneCount = info.filter(x => x.complete).length;
  SCH = { startDn, monDn, tDn, pivot, cal, info, lessonDn, endDn, weeks, todayLi, nextPending: nextPending ? nextPending.L.li : null, behind: Math.max(0, Math.min(expected, NL) - doneCount), doneCount };
  return SCH;
}
const entryOf = dn => SCH.cal.get(dn) || { dn, dow: dowOf(dn), lessons: [], worked: [], adv: [] };
const weekOf = dn => Math.floor((dn - SCH.monDn) / 7);
function modsOfWeekC(c) { const w = SCH.weeks[c]; const out = []; if (w) w.lessons.forEach(L => modsOfLesson(L).forEach(m => { if (!out.includes(m)) out.push(m); })); return bySubject(out); }

function satItems(c) {
  const wk = SCH.weeks[c] || { lessons: [], sim: false, themeIdx: 0 };
  const key = n => 's:c' + c + ':' + n;
  if (wk.sim) {
    const sm = SIMULADOS[wk.simIdx % SIMULADOS.length];
    return [
      { k: key(1), type: 's', title: 'Simulado ' + sm[0], txt: sm[1] + '. Duração real: ' + sm[2] + '. Abra a prova no site do INEP, cronometre e marque as respostas numa folha à parte, sem celular.', link: ['INEP · Provas e gabaritos', GENERAL[0][2]], min: sm[2] === '5h30' ? 330 : 300 },
      { k: key(2), type: 's', title: 'Correção do simulado (domingo ou segunda)', txt: 'Corrija pelo gabarito oficial, conte os acertos por área e anote no caderno de erros os temas que mais errou.', min: 0 }
    ];
  }
  const mods = modsOfWeekC(c);
  const spaced = bySubject([...new Set([c - 1, c - 4].filter(x => x >= 0).flatMap(x => modsOfWeekC(x)))].filter(m => !mods.includes(m)));
  const ti = wk.themeIdx || 0;
  const th = ti < THEMES.length ? THEMES[ti] : EXTRA_THEMES[(ti - THEMES.length) % EXTRA_THEMES.length];
  const cortes = []; mods.forEach(m => (m.cortes || []).forEach(v => cortes.push(v)));
  const items = [
    { k: key(1), type: 's', title: 'Revisão da semana', txt: mods.length ? 'Para cada tema estudado nesta semana, escreva um resumo de 5 linhas sem consultar e revise os flashcards. Refaça as questões que errou.' : 'Nenhuma aula foi concluída nesta semana. Revise os flashcards e resumos das últimas aulas e, se der, adiante a próxima aula pendente.', mods, min: 90 },
    { k: key(2), type: 's', title: 'Questões do ENEM sobre os temas da semana', txt: 'Resolva 20 questões das provas anteriores (site do INEP) ligadas aos temas acima. Corrija e registre cada erro no caderno de erros.', link: ['INEP · Provas e gabaritos', GENERAL[0][2]], min: 60 },
    { k: key(3), type: 's', title: 'Revisão espaçada', txt: spaced.length ? 'Revise os flashcards e resumos destes temas de 1 e de 4 semanas atrás:' : 'Ainda não há semanas anteriores. Use o tempo para revisar os flashcards desta semana.', mods: spaced, min: 30 },
    { k: key(4), type: 's', title: 'Redação: ' + th[0], txt: (th[1] === 'treino' ? 'Tema de treino baseado em atualidades. ' : 'Tema oficial do ' + th[1] + '. ') + 'Planeje por 15 min (tese, 2 argumentos com repertório, proposta com agente, ação, meio, finalidade e detalhamento), escreva em 60 min e corrija pelas 5 competências da cartilha do INEP.', atu: ti < THEMES.length ? ATU_BY_THEME[ti] : [], min: 90 }
  ];
  if (cortes.length) items.push({ k: key(5), type: 's', title: 'Vídeos de revisão dos temas da semana', txt: 'Cortes dos aulões do canal sobre o que você estudou:', cortes: cortes.slice(0, 3), min: 30 });
  else items.push({ k: key(5), type: 's', title: 'Leitura de atualidades', txt: 'Leia duas reportagens ligadas ao tema da redação (Nexo, BBC News Brasil ou Agência Brasil) e anote dados que poderia usar como repertório.', min: 30 });
  return items;
}
function progressStats() {
  let tot = 0, done = 0; const perWeek = Array(WEEKS).fill(0).map(() => [0, 0]);
  LESSONS.forEach(L => lessonItems(L).forEach(t => { tot++; perWeek[L.w][1]++; if (S.done[t.k]) { done++; perWeek[L.w][0]++; } }));
  return { tot, done, perWeek };
}

  } else {

<li><b>Exercícios logo depois.</b> Quem nunca resolve questões não aprende para o ENEM. O bloco de exercícios de cada módulo é tão importante quanto o vídeo.</li>
<li><b>Caderno de erros.</b> Toda questão errada vira uma linha: tema, por que errou (conteúdo, interpretação, distração) e a resposta certa explicada.</li>
<li><b>Flashcards.</b> No Anki, crie de 3 a 5 cartões por tema (pergunta de um lado, resposta curta do outro). Revise todo dia; o próprio aplicativo espaça as revisões.</li>

    if (r && rep > lep) { S = Object.assign({}, S, { ep: rep, start: r.start || S.start, exam: r.exam || S.exam, lem: r.lem || S.lem, done: Object.assign({}, r.done || {}), quiz: [], t: r.t }); saveLocal(); rerender(); ACC.seen = rt; ACC.at = Date.now(); accSave(); setSync('acc'); accBusy = false; if (accDirty) accSync(); return; }
    const remoteChanged = !!r && rt !== seen, localChanged = (S.t || 0) !== seen, stale = syncStale(r);
    if (remoteChanged && localChanged) { syncUnion(r); await accWrite(); }
    else if (remoteChanged) { syncAdopt(r); ACC.seen = rt; ACC.at = Date.now(); accSave(); if (stale) await accWrite(); }
    else if (!r || localChanged || stale) await accWrite();
    else { ACC.at = Date.now(); accSave(); }
    setSync('acc');
  } catch (e) {
    if (e.message === 'sessao' || e.message === 'permissao') { ACC = { email: ACC.email }; accSave(); setSync('acc-sessao'); if (view === 'metodo') render(); }
    else setSync('acc-off');
  }
  accBusy = false;
  if (accDirty) accSync();
}
function accTouch() { if (!accOn()) return; setSync('acc-saving'); clearTimeout(accTimer); accTimer = setTimeout(() => { accTimer = null; accSync(); }, 2000); }
async function accEnter(mode, email, pass) {
  const j = await fbAuth(mode === 'nova' ? 'accounts:signUp' : 'accounts:signInWithPassword', { email, password: pass, returnSecureToken: true });
  ACC = { seen: 0, at: 0 };
  accSession(j, email);
  const before = Object.keys(S.done).length, r = await accRead();
  if (r) { ACC.devices = r.devices || {}; syncUnion(r); }
  else if (!S.t) S.t = Date.now();
  await accWrite();
  const got = Object.keys(S.done).length - before;
  return mode === 'nova' ? 'Conta criada! Agora, em qualquer aparelho, abra o site, toque em "Conta e sincronização" e entre com este e-mail e esta senha.' : 'Pronto, você entrou.' + (got > 0 ? ' ' + got + ' tarefas vieram dos seus outros aparelhos.' : ' Seu progresso está sincronizado.');
}
function accHTML() {
  if (inClaude() || !fbReady()) return '';
  if (accOn()) {
    const me = syncDevice().id, when = t => new Date(t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const devs = Object.entries(ACC.devices || {}).sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
    const list = devs.length ? '<ul class="ghdevs">' + devs.map(([id, d]) => '<li><b>' + esc(d.name || 'Aparelho') + '</b>' + (id === me ? ' (este aparelho)' : '') + ' · registrado em ' + when(d.at || 0) + '</li>').join('') + '</ul>' : '';
    const alone = devs.length < 2 ? '<p class="note">Só este aparelho entrou até agora. Nos outros (iPad, celular, outro computador), abra o site, toque em "Conta e sincronização" e entre com o mesmo e-mail e senha.</p>' : '';
    return `<div class="ghsync" id="conta"><h3>Sua conta</h3><p>Conectado como <b>${esc(ACC.email || '')}</b>. Tudo o que você marcar aparece nos seus outros aparelhos em poucos segundos (ao abrir ou voltar para a página). Última sincronização: ${ACC.at ? when(ACC.at) : 'agora'}.</p><p>Aparelhos conectados:</p>${list}${alone}<div class="xbtns"><button class="btn" id="acc-now" type="button">Sincronizar agora</button><button class="btn ghost" id="acc-out" type="button">Sair da conta neste aparelho</button></div></div>`;
  }
  const a = accCfg() || {}, mode = ACC_MODE || (a.email ? 'entrar' : 'nova'), nova = mode === 'nova';
  return `<div class="ghsync" id="conta"><h3>Sua conta grátis: seu progresso em qualquer aparelho</h3>
<p>Crie uma conta com seu e-mail e uma senha. Depois é só entrar com os mesmos dados no celular, no tablet ou em outro computador: o que você marcar aparece em todos, sozinho.</p>
<div class="xbtns accmodes"><button class="btn sm${nova ? '' : ' ghost'}" type="button" data-accmode="nova" aria-pressed="${nova}">Criar conta</button><button class="btn sm${nova ? ' ghost' : ''}" type="button" data-accmode="entrar" aria-pressed="${!nova}">Já tenho conta</button></div>
<form id="acc-form" class="accform" novalidate>
<label>E-mail <input type="email" id="acc-email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(a.email || '')}"></label>
<label>Senha <input type="password" id="acc-pass" name="password" autocomplete="${nova ? 'new-password' : 'current-password'}" placeholder="${nova ? 'Pelo menos 6 caracteres' : ''}"></label>
<div class="xbtns"><button class="btn" type="submit" id="acc-go">${nova ? 'Criar conta' : 'Entrar'}</button>${nova ? '' : '<button class="linkbtn" type="button" id="acc-forgot">Esqueci a senha</button>'}</div>
</form>
<p class="small">${nova ? 'Se este aparelho já tem progresso marcado, ele vai junto para a sua conta.' : 'O progresso deste aparelho é somado ao da sua conta.'} Anote o e-mail e a senha: são eles que abrem seu cronograma em outros aparelhos.</p></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-accmode], #acc-now, #acc-out, #acc-forgot');
  if (!t) return;
  if (t.dataset.accmode) { ACC_MODE = t.dataset.accmode; const em = (document.getElementById('acc-email') || {}).value; if (em) { ACC = Object.assign(accCfg() || {}, { email: em }); } goTransfer(); const f = document.getElementById(em ? 'acc-pass' : 'acc-email'); if (f) f.focus(); return; }
  if (t.id === 'acc-now') {
    await accSync(); goTransfer();
    const m = document.getElementById('sync'), ok = m && m.dataset.mode === 'acc';
    xmsg(ok ? 'Sincronizado agora.' : 'Não consegui sincronizar: ' + (m ? m.textContent : '') + '.', !ok);
  } else if (t.id === 'acc-out') {
    ACC = { email: ACC.email }; accSave(); ACC_MODE = 'entrar'; setSync('local'); goTransfer();
    xmsg('Você saiu da conta neste aparelho. O progresso continua salvo aqui e na sua conta.');
  } else if (t.id === 'acc-forgot') {
    const email = ((document.getElementById('acc-email') || {}).value || '').trim();
    if (!email) { xmsg('Digite seu e-mail no campo acima e toque de novo em "Esqueci a senha".', true); return; }
    try { await fbAuth('accounts:sendOobCode', { requestType: 'PASSWORD_RESET', email }); xmsg('Se existir uma conta com ' + email + ', chegou um e-mail com um link para criar uma senha nova (veja também o spam).'); }
    catch (err) { xmsg(accErr(err.message), true); }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'acc-form') return;
  e.preventDefault();
  const email = (document.getElementById('acc-email').value || '').trim(), pass = document.getElementById('acc-pass').value || '';
  const mode = ACC_MODE || ((accCfg() || {}).email ? 'entrar' : 'nova');
  if (!email) { xmsg(ACC_ERR.MISSING_EMAIL, true); return; }
  if (!pass) { xmsg(ACC_ERR.MISSING_PASSWORD, true); return; }
  if (mode === 'nova' && pass.length < 6) { xmsg(ACC_ERR.WEAK_PASSWORD, true); return; }
  const b = document.getElementById('acc-go'); b.disabled = true; b.textContent = mode === 'nova' ? 'Criando…' : 'Entrando…';
  try { const msg = await accEnter(mode, email, pass); ACC_MODE = null; setSync('acc'); goTransfer(); xmsg(msg); }
  catch (err) { if (accOn()) { ACC = { email }; accSave(); } b.disabled = false; b.textContent = mode === 'nova' ? 'Criar conta' : 'Entrar'; xmsg(accErr(err.message), true); }
});
if (!inClaude()) {
  if (accOn()) setTimeout(accSync, 500);
  document.addEventListener('visibilitychange', () => {
    if (!accOn()) return;
    if (document.hidden) { if (accTimer) { clearTimeout(accTimer); accTimer = null; accSync(); } }
    else accSync();
  });
  window.addEventListener('online', () => { if (accOn()) accSync(); });
  setInterval(() => { if (accOn() && !document.hidden) accSync(); }, 120000);
}

// pede ao navegador para não apagar os dados desta página
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => {}); } catch (e) {}

</script>
