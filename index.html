<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Cronograma de estudos para o ENEM 2027: 130 aulas com os v&iacute;deos do Curso Enem Gratuito, exerc&iacute;cios, revis&otilde;es, reda&ccedil;&atilde;o, simulados e metodologia."><meta name="theme-color" content="#131A2A"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='6' fill='%23131A2A'/%3E%3Crect x='6' y='10' width='52' height='12' rx='6' fill='%23BE123C'/%3E%3Ccircle cx='22' cy='38' r='6' fill='%23fff'/%3E%3Ccircle cx='42' cy='38' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ENEM 2027"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Cronograma ENEM 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: folha de prova — cabeçalho fixo com a faixa das 26 semanas, conteúdo em coluna única larga, blocos do dia como questões numeradas com bolinhas de cartão-resposta */
:root {
  --paper: #EEF1F5; --sheet: #FFFFFF; --ink: #131A2A; --ink2: #4B5568; --line: #D6DCE5; --soft: #E6EAF0;
  --pen: #1D4ED8; --ok: #15803D;
  --lc: #C2410C; --ch: #6D3FC0; --cn: #0F766E; --mt: #BE123C; --rd: #8A5A00; --rv: #334155;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D121C; --sheet: #151C2A; --ink: #E8ECF3; --ink2: #A2ACBF; --line: #273246; --soft: #1C2536;
  --pen: #7FA6FF; --ok: #4ADE80; --lc: #FB9A5B; --ch: #B9A0FF; --cn: #4FD1C0; --mt: #FF7E9C; --rd: #E3B456; --rv: #A9B6CC; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0D121C; --sheet: #151C2A; --ink: #E8ECF3; --ink2: #A2ACBF; --line: #273246; --soft: #1C2536;
  --pen: #7FA6FF; --ok: #4ADE80; --lc: #FB9A5B; --ch: #B9A0FF; --cn: #4FD1C0; --mt: #FF7E9C; --rd: #E3B456; --rv: #A9B6CC; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: var(--pen); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
.a-lc { --c: var(--lc); } .a-ch { --c: var(--ch); } .a-cn { --c: var(--cn); } .a-mt { --c: var(--mt); } .a-rd { --c: var(--rd); } .a-rv { --c: var(--rv); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }

/* cabeçalho */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.toprow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; padding-block: 14px 10px; }
.brand { min-width: 0; flex: 1 1 260px; }
.eyebrow { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
h1 { margin: 2px 0 0; font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: clamp(26px, 4vw, 36px); line-height: 1; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.prog { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; flex: 1 1 320px; min-width: 0; }
#pct { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; grid-row: span 2; }
#pcount { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
#strip { display: grid; grid-template-columns: repeat(26, 1fr); gap: 3px; }
#strip i { display: block; height: 14px; border-radius: 3px; border: 1px solid var(--line); background: linear-gradient(to top, var(--ink) calc(var(--f) * 100%), transparent 0); }
#strip i.now { border-color: var(--pen); box-shadow: 0 0 0 1px var(--pen); }
.settings { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding-bottom: 10px; font-size: 14px; }
.settings label { display: inline-flex; align-items: center; gap: 6px; }
.settings input[type=date] { font: inherit; font-family: var(--mono); font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg label { padding: 3px 12px; cursor: pointer; gap: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--sheet); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--pen); outline-offset: -2px; }
.syncwrap { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
#sync { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
#xfer { font-size: 13px; }
/* backup e transferência */
.pointer { margin: 0; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--sheet); }
.xfer { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px 22px; margin-top: 8px; }
.xfer > div { min-width: 0; }
.xfer h3 { margin: 4px 0 6px; font-size: 16px; }
.xfer ol { margin: 0 0 8px; }
.xfer textarea { width: 100%; min-height: 70px; font: 12px/1.4 var(--mono); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); resize: vertical; }
.xbtns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.btn { font: inherit; font-size: 14px; font-weight: 700; padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { opacity: .88; }
.filebtn { display: inline-block; font-size: 14px; color: var(--pen); text-decoration: underline; cursor: pointer; }
.filebtn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.filebtn:focus-within { outline: 2px solid var(--pen); outline-offset: 2px; }
.xmsg { margin: 6px 0 0; font-size: 14px; color: var(--ok); min-height: 1.2em; }
.xmsg.bad { color: var(--mt); }
.impbox { background: var(--sheet); border: 2px solid var(--pen); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.impbox p { margin: 0; }
#sync[data-mode=cloud]::before, #sync[data-mode=gh]::before { content: "● "; color: var(--ok); }
#sync[data-mode=saving]::before, #sync[data-mode=gh-saving]::before { content: "◐ "; color: var(--pen); }
#sync[data-mode=local]::before, #sync[data-mode=offline]::before, #sync[data-mode=gh-off]::before { content: "○ "; }
#sync[data-mode=gh-token]::before { content: "○ "; color: var(--mt); }
.ghsync { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; }
.ghsync h3 { margin-top: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { font: inherit; font-family: var(--display); font-stretch: 85%; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-size: 15px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--ink2); padding: 8px 14px 9px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs button:hover { color: var(--ink); }
#flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

main { padding-block: 22px 96px; }
.note { margin: 0 0 12px; font-size: 14px; color: var(--ink2); }
.linkbtn { font: inherit; color: var(--pen); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

/* dia */
.dayhead { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin-bottom: 18px; }
.dayhead h2 { margin: 2px 0 0; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.05; text-wrap: balance; }
.dh { min-width: 0; }
.nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; }
.nav:disabled { opacity: .35; cursor: default; }
.blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 14px; align-items: start; }
.block { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; }
.block.wide { max-width: 860px; }
.bhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bnum { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.chip { display: inline-block; font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--c); border: 1.5px solid var(--c); border-radius: 4px; padding: 1px 6px; line-height: 1.35; white-space: nowrap; }
.dur { margin-left: auto; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.block h3 { margin: 8px 0 2px; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.block h3 .sep { color: var(--ink2); font-weight: 400; }
.mtag { margin: 0 0 6px; font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.tasks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.task { display: grid; grid-template-columns: 30px 1fr; gap: 6px; padding: 7px 0; border-top: 1px dashed var(--line); }
.task:first-child { border-top: 0; }
.tbody { min-width: 0; overflow-wrap: anywhere; }
.tmain { font-size: 15px; line-height: 1.35; }
.task.is-done .tmain { color: var(--ink2); }
.task.is-done .tmain a { color: var(--ink2); }
.kind { display: inline-block; font-family: var(--mono); font-size: 12px; color: var(--ink2); margin-top: 2px; }
.txt { display: block; font-size: 14px; color: var(--ink2); margin-top: 2px; }
.part { font-family: var(--mono); font-size: 12px; color: var(--ink2); font-weight: 400; }
.bub { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 1.75px solid var(--ink2); border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--sheet); transition: background .12s, border-color .12s; }
.bub::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .12s; }
.bub:checked { border-color: var(--ink); }
.bub:checked::after { transform: scale(1.3); }
.bub:hover { border-color: var(--ink); }
.alt { margin-top: 4px; font-size: 13.5px; }
.alt summary { cursor: pointer; color: var(--ink2); font-size: 13px; }
.alt ul, .modlist { margin: 4px 0 0; padding-left: 18px; }
.modlist { list-style: none; padding-left: 0; display: grid; gap: 4px; font-size: 14px; }
.modlist .chip { font-size: 11px; padding: 0 5px; }
.ext { display: inline-block; margin-top: 4px; font-size: 14px; }
.rep { margin-top: 4px; font-size: 14px; }
.deep { margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink2); }
.deep span { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
.rest .txt { font-size: 15px; max-width: 65ch; }

/* semanas */
.month { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 10px; font-family: var(--display); font-stretch: 80%; font-weight: 700; font-size: 20px; text-transform: uppercase; }
.month:first-child { margin-top: 0; }
.month span { font-weight: 800; font-size: 26px; }
.week { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.wkhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wkhead h3 { margin: 0; font-family: var(--display); font-stretch: 80%; font-size: 19px; text-transform: uppercase; }
.wkdates { font-family: var(--mono); font-size: 13px; color: var(--ink2); }
.wkpct { margin-left: auto; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.wkdays { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.wkday { font: inherit; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 7px; cursor: pointer; color: var(--ink); display: grid; gap: 4px; min-width: 0; }
.wkday:hover { border-color: var(--ink2); }
.wkday.today { border-color: var(--pen); box-shadow: 0 0 0 1px var(--pen); }
.wkday.full { background: var(--soft); }
.dn { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
.dlab { font-size: 12px; color: var(--ink2); }
.mini { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.mini b { display: block; height: 100%; background: var(--ink); }
.wkmods { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 5px 18px; font-size: 13px; color: var(--ink2); }
.wkmods li { min-width: 0; padding-left: 8px; border-left: 2px solid var(--c); }
.wkmods b { color: var(--c); font-weight: 700; }

/* matérias */
.lede { max-width: 70ch; color: var(--ink2); margin: 0 0 16px; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 14px; align-items: start; }
.subj { background: var(--sheet); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.shead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.shead h2 { margin: 0; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: 24px; text-transform: uppercase; color: var(--c); }
.sarea { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.sbar { height: 6px; border-radius: 3px; background: var(--soft); margin: 10px 0 4px; overflow: hidden; }
.sbar b { display: block; height: 100%; background: var(--c); }
.snums { margin: 0 0 6px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.subj details { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.subj summary { cursor: pointer; font-weight: 700; font-size: 15px; }
.mods { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 14.5px; }
.mods li::marker { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.mrow { display: flex; gap: 10px; justify-content: space-between; }
.mname { min-width: 0; }
.mwk { font-family: var(--mono); font-size: 12px; color: var(--ink2); white-space: nowrap; }
.mods .mtag { display: block; margin: 0; }
.mlinks { font-size: 13px; }
.badge { font-family: var(--mono); font-size: 11px; color: var(--c); border: 1px solid var(--c); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.res { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 9px; font-size: 14.5px; }
.res li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: baseline; }
.res li > div { min-width: 0; overflow-wrap: anywhere; }
.res p { margin: 1px 0 0; font-size: 13.5px; color: var(--ink2); }
.rtype { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border: 1px solid var(--line); border-radius: 3px; text-align: center; padding: 1px 0; }
.general { margin-top: 20px; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.general h2 { margin: 0; font-family: var(--display); font-stretch: 78%; font-size: 22px; text-transform: uppercase; }

/* método */
.prose { display: grid; gap: 14px; }
.prose section { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.prose h2 { margin: 0 0 8px; font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: 22px; text-transform: uppercase; }
.prose p, .prose li { max-width: 75ch; }
.prose ol, .prose ul { padding-left: 22px; display: grid; gap: 6px; }
.small { font-size: 14px; color: var(--ink2); }
.tablewrap { overflow-x: auto; margin: 10px 0; }
.grid { border-collapse: collapse; font-size: 14px; min-width: 640px; }
.grid th, .grid td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.grid th { font-weight: 700; white-space: nowrap; }
.grid .chip { font-size: 11px; }
.matrix td:first-child { font-weight: 700; }
.themes { list-style: none; padding-left: 0 !important; columns: 2 320px; column-gap: 28px; display: block !important; }
.themes li { break-inside: avoid; margin-bottom: 6px; font-size: 14.5px; }
.themes .wk { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.phases li { max-width: 80ch; }

/* agenda flexível */
#forecast { margin: 0 0 8px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
#forecast b { color: var(--ink); font-weight: 700; }
#forecast.tight b, #forecast.tight { color: var(--rd); }
#forecast.bad, #forecast.bad b { color: var(--mt); }
.note.warn { color: var(--rd); }
.note.ok { color: var(--ok); }
.lesson { margin-bottom: 18px; }
.lhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 0 0 10px; }
.lnum { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 20px; text-transform: uppercase; }
.lmeta { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.lflag { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.lprog { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dayhead.single { grid-template-columns: 1fr; }
.howto { margin: 8px 0 0; font-size: 13px; }
.flag { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-radius: 3px; padding: 0 5px; border: 1px solid currentColor; }
.flag.now { color: var(--pen); } .flag.end { color: var(--ok); } .flag.lim { color: var(--mt); }
.week.past { opacity: .82; }
.wkday.gap { border-style: dashed; }
.wkday.future { background: var(--sheet); }
.aula { font-size: 12.5px; font-weight: 700; }

/* metodologia */
.toc { display: flex; flex-wrap: wrap; gap: 6px; background: transparent !important; border: 0 !important; padding: 0 !important; }
.toc button { font: inherit; font-size: 13px; background: var(--sheet); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.toc button:hover { border-color: var(--ink2); }
.met section { scroll-margin-top: 200px; }
.met h3 { margin: 14px 0 6px; font-size: 17px; }
.met h4 { margin: 4px 0 6px; font-family: var(--display); font-stretch: 85%; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; color: var(--c, var(--ink)); }
.steps li { padding-left: 2px; }
.rate { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; border-radius: 3px; padding: 1px 6px; border: 1px solid currentColor; white-space: nowrap; }
.rate.hi { color: var(--ok); } .rate.mid { color: var(--rd); } .rate.lo { color: var(--mt); }

function words(n) {

function similar(a, b) {
  if (!a.size || !b.size) return false;
  let inter = 0; a.forEach(w => { if (b.has(w)) inter++; });
  return inter / (a.size + b.size - inter) >= 0.7;
}

function matchModule(s, n) {
  const mods = MODULES[s]; if (!mods) return null;
  for (let mi = 0; mi < mods.length; mi++) {
    const pats = mods[mi][3];
    for (let i = 0; i < pats.length; i++) if (RX(pats[i]).test(n)) return { mi, rank: i };

}

function classify() {
  const C = {};
  Object.keys(MODULES).forEach(s => {
    C[s] = { mods: MODULES[s].map(([k, name, tag, pats, ex]) => ({ k, name, tag, ex: ex || {}, s, r: PROG_REQ[k] || [], vids: [], cortes: [] })), extra: { k: s.toLowerCase() + '-extra', name: 'Dicas, estratégias e questões comentadas', tag: '', ex: {}, s, r: [], vids: [], cortes: [] } };
  });
  const review = { aul: [], loose: [] }, atu = [], excluded = [];
  for (const v of VIDS) {
    v.n = N(v.t);
    if (v.s < 120 || EXCL.test(v.n)) { excluded.push(v); continue; }
    let s = CODE2S[v.c];
    for (const [re, to] of CROSS) if (re.test(v.n)) s = to;
    if (s === 'ATU') { atu.push(v); continue; }
    const contentCorte = ['ART', 'ING', 'ESP'].includes(v.c);
    if (s === 'AUL' || /AULAO/.test(v.n) || (REVIEW.test(v.n) && !contentCorte)) {
      const ks = kwSubject(v.n.split(/AULAO|AULOES/).pop()) || kwSubject(v.n) || s;
      v.rs = ks;
      if (/AULAO/.test(v.n) || v.s > 1500) { review.aul.push(v); continue; }
      const m = C[ks] && matchModule(ks, v.n);
      const cm = !m && CORTE_MAP.find(([p]) => RX(p).test(v.n));
      const cmod = cm && C[ks] && C[ks].mods.find(x => x.k === cm[1]);
      if (m) C[ks].mods[m.mi].cortes.push(v); else if (cmod) cmod.cortes.push(v); else review.loose.push(v);
      continue;
    }
    if (!C[s]) { excluded.push(v); continue; }
    const m = matchModule(s, v.n);
    if (m) { v.rank = m.rank; C[s].mods[m.mi].vids.push(v); }
    else { v.rank = 99; C[s].extra.vids.push(v); }
  }
  // ordem dentro do módulo + reforços opcionais (mesmo tema, outro professor)
  Object.values(C).forEach(sub => {
    sub.mods.push(sub.extra);
    sub.mods.forEach(m => {
      // do mais simples ao mais difícil: introdução → conteúdo (na ordem dos subtemas) → exercícios e questões do ENEM no fim
      m.vids.forEach(v => { v.lvl = LVL_PRACTICE.test(v.n) ? 2 : LVL_INTRO.test(v.n) ? 0 : 1; });
      m.vids.sort((a, b) => (a.lvl === 2) - (b.lvl === 2) || a.rank - b.rank || a.lvl - b.lvl || b.idx - a.idx);
      const main = [];
      for (const v of m.vids) {
        v.w = words(v.n);
        const twin = main.find(x => similar(x.w, v.w));
        if (twin) (twin.alt = twin.alt || []).push(v); else main.push(v);
      }
      // limite de minutos por módulo: mantém pelo menos um vídeo de cada subtema e manda o resto para "reforço opcional"
      const cap = CAP[m.s];
      if (cap && main.reduce((a, v) => a + v.s / 60, 0) > cap) {
        const groups = new Map();
        main.forEach(v => { if (!groups.has(v.rank)) groups.set(v.rank, []); groups.get(v.rank).push(v); });
        const keep = new Set(); let tot = 0;
        for (let r = 0; ; r++) {
          let any = false;
          for (const g of groups.values()) {
            const v = g[r]; if (!v) continue; any = true;
            if (r === 0 || tot + v.s / 60 <= cap) { keep.add(v); tot += v.s / 60; }
          }
          if (!any) break;
        }
        const kept = main.filter(v => keep.has(v)), extra = main.filter(v => !keep.has(v));
        if (kept.length && extra.length) { const last = kept[kept.length - 1]; last.alt = (last.alt || []).concat(extra); }
        m.main = kept;

  });

  Object.keys(C).forEach(s => {
    const ord = PROG_ORDER[s];
    if (!ord) return;
    const pos = k => { const i = ord.indexOf(k); return i < 0 ? (/extra$/.test(k) ? 9999 : 5000) : i; };
    C[s].mods = C[s].mods.map((m, i) => [m, i]).sort((a, b) => pos(a[0].k) - pos(b[0].k) || a[1] - b[1]).map(x => x[0]);
  });

  Object.keys(C).forEach(s => {
    const ex = C[s].mods.find(m => /extra$/.test(m.k));
    if (ex) ex.r = C[s].mods.filter(m => m !== ex).map(m => m.k);
  });
  return { C, review, atu, excluded };
}

        if (blocked) {
          const next = st.mods[0];
          const missing = (next.r || []).filter(k => MODBYKEY[k] && !(modDone[k] != null && modDone[k] < dayI)).map(k => MODBYKEY[k]);
          const recent = st.last.slice(-2);
          items.push({ k: 'c:' + s + ':' + dayI, type: 'f', s, title: 'Consolidação de ' + SUBJECTS[s].n, txt: 'O próximo tema (' + next.name + ') precisa de ' + missing.map(m => SUBJECTS[m.s].n + ': ' + m.name).join('; ') + ', que vem em breve na agenda. Use este tempo para refazer os exercícios e questões do ENEM dos últimos temas' + (recent.length ? ': ' + recent.map(m => m.name).join(' · ') : '') + '.', min: rem, mods: recent });
        } else items.push({ k: 'f:' + s + ':' + dayI, type: 'f', s, title: final ? 'Questões ENEM de ' + SUBJECTS[s].n + ' (provas do INEP)' : 'Prática livre de ' + SUBJECTS[s].n, txt: final ? 'Resolva questões de anos anteriores e revise o caderno de erros.' : 'Conteúdo da matéria em dia. Use o tempo para questões do ENEM dos temas já vistos e para o caderno de erros.', min: rem });
      }
    }
    return items;
  };
  days.forEach(day => {
    if (day.type !== 'study') return;
    TEMPLATE[day.d].forEach(([s, min]) => {
      const b = { s, min, items: [], mods: [], day };
      day.blocks.push(b);
      if (s === 'REV') return;
      if (s === 'LEM') { b.tracks = { ING: fillBlock('ING', b), ESP: fillBlock('ESP', b) }; b.items = null; }
      else b.items = fillBlock(s, b);
    });
  });
  const unscheduled = {};
  Object.keys(state).forEach(s => { const n = state[s].mods.length + (state[s].cur.length ? 1 : 0); if (n) unscheduled[s] = n; });

  // módulos por dia (para revisões) e primeira semana de cada módulo
  const modWeeks = {};
  days.forEach(day => day.blocks.forEach(b => {
    const lists = b.tracks ? [['ING', b.tracks.ING], ['ESP', b.tracks.ESP]] : [[b.s, b.items || []]];
    lists.forEach(([s, items]) => items.forEach(t => {
      if (!t.mod) return;
      const key = t.mod.k;
      if (!modWeeks[key]) modWeeks[key] = { first: day.w, last: day.w, mod: t.mod, s };
      modWeeks[key].last = day.w;
      if (!b.mods.includes(t.mod)) b.mods.push(t.mod);
      day.mods.add(t.mod);
    }));
  }));
  return { C, days, stats, modWeeks, review, atu, excluded, aulBy, unscheduled };
}

<section id="met-dia"><h2>O estudo do dia a dia, passo a passo</h2>
<ol class="steps">
<li><b>Prepare o ambiente (5 min).</b> Celular em outro cômodo ou no modo avião, água por perto, caderno, caderno de erros e a aba Hoje aberta.</li>
<li><b>Bloco de revisão ativa (20 min).</b> Sem olhar nada, escreva numa folha tudo o que lembra da aula anterior. Depois abra o caderno, confira e complete com outra cor. Faça os flashcards do Anki do dia.</li>
<li><b>Blocos de matéria.</b> Siga o protocolo de 5 passos descrito em "Cada bloco". Entre um bloco e outro, faça 10 minutos de pausa longe da tela (fora das 5 horas).</li>
<li><b>Feche o dia (10 min).</b> Marque as bolinhas do que fez, anote no caderno de erros o que ficou pendente e olhe rapidamente a aula de amanhã.</li>

<section id="met-bloco"><h2>Protocolo de cada bloco (5 passos)</h2>
<ol class="steps">
<li><b>Prever (2 min).</b> Leia o nome do módulo e escreva o que você já sabe e duas perguntas que espera responder.</li>
<li><b>Assistir com anotações.</b> Vídeo com caderno aberto, pausando para anotar com suas palavras (veja "Anotações"). O tempo previsto no cronograma já inclui essas pausas.</li>
<li><b>Recuperar (5 min).</b> Feche o vídeo e o caderno. Explique em voz alta ou por escrito o que aprendeu, como se ensinasse alguém (técnica de Feynman). Onde travar, volte só naquele ponto.</li>
<li><b>Praticar.</b> Faça a tarefa de exercícios do módulo. Corrija logo em seguida.</li>
<li><b>Registrar (3 min).</b> Cada erro vai para o caderno de erros. Crie de 3 a 5 flashcards com o que é essencial.</li>
</ol></section>

<section id="met-notas"><h2>Como anotar: método Cornell</h2>
<p>Divida a página em três partes. Na coluna da direita (larga), as anotações durante o vídeo. Na coluna da esquerda (estreita), escreva depois as perguntas que aquelas anotações respondem. No rodapé, um resumo de 2 linhas.</p>
<p>Para revisar, cubra a coluna da direita e tente responder as perguntas da esquerda. Isso transforma o caderno numa ferramenta de autoteste.</p>
<p class="small">Use desenhos, setas e tabelas sempre que puder. Não copie tudo o que o professor fala: anote ideias, exemplos e o que você não sabia.</p></section>

<section id="met-rev"><h2>O sistema de revisões</h2>
<p>A memória cai rápido nos primeiros dias depois do estudo. Cada revisão feita no momento certo faz o conteúdo durar mais. O cronograma usa quatro camadas:</p>
<div class="layers">
<div><b>1 dia depois</b><span>Bloco de revisão ativa no início de cada aula.</span></div>
<div><b>1 semana depois</b><span>Sábado: resumo de cada tema, questões do ENEM e flashcards.</span></div>
<div><b>4 semanas depois</b><span>Sábado: revisão espaçada dos temas de 1 e de 4 semanas atrás.</span></div>
<div><b>Todo dia</b><span>Anki: o aplicativo mostra cada cartão no intervalo certo.</span></div>
</div>
<h3>Caderno de erros</h3>
<p>Uma página por matéria. Para cada questão errada, anote: tema, fonte da questão, <b>por que errou</b> (não sabia o conteúdo, não entendeu o enunciado, errou a conta, distração, faltou tempo) e a explicação certa com suas palavras. Todo sábado, refaça as questões do caderno sem olhar a resposta. Quando acertar a mesma questão em duas revisões seguidas, risque.</p>
<p class="small">O motivo do erro importa: errar por interpretação pede mais leitura de enunciados; errar por conteúdo pede voltar ao módulo; errar por distração pede conferir a pergunta antes de marcar.</p></section>

<section id="met-cards"><h2>Flashcards que funcionam</h2>
<ul>
<li><b>Uma informação por cartão.</b> "Qual organela produz ATP?" é melhor que "Fale sobre as organelas".</li>
<li><b>Em forma de pergunta</b>, não de frase solta.</li>
<li><b>Use lacunas:</b> "A unidade de potência no SI é o ___".</li>
<li><b>Use imagens</b> em Biologia, Química Orgânica, Geografia e Artes.</li>
<li><b>Evite listas longas</b> no verso. Quebre em vários cartões.</li>
<li><b>Escreva com suas palavras</b> e só depois de entender o conteúdo.</li>
<li><b>Seja honesto</b> ao avaliar se lembrou. Errar no Anki é o que faz ele funcionar.</li>
</ul>
<p class="small">Sem Anki, use o sistema de Leitner: 5 caixas de papel. Acertou, o cartão vai para a caixa seguinte (revisada com menos frequência); errou, volta para a caixa 1. Revise a caixa 1 todo dia, a 2 a cada 2 dias, a 3 uma vez por semana, a 4 a cada 2 semanas e a 5 uma vez por mês.</p></section>

<section id="met-prova"><h2>Na hora da prova</h2>
<h3>Como a nota é calculada (TRI)</h3>
<ul>
<li>O INEP usa a Teoria de Resposta ao Item. Cada questão tem um nível de dificuldade, e a nota considera a <b>coerência</b> dos seus acertos.</li>
<li>Quem acerta questões difíceis mas erra fáceis ganha menos pontos, porque o sistema entende que os acertos difíceis podem ter sido chute. Por isso, garanta as fáceis.</li>
<li>Não existe desconto por erro, e questão em branco conta como erro. Nunca deixe questão em branco.</li>
</ul>
<h3>Estratégia</h3>
<ol class="steps">
<li><b>Primeira volta:</b> resolva as questões que você sabe e marque as difíceis para depois. Não gaste mais de 4 minutos numa questão.</li>
<li><b>Segunda volta:</b> volte às marcadas, eliminando alternativas.</li>
<li><b>Reserve 20 minutos</b> para passar o gabarito para o cartão-resposta e marcar o que faltou.</li>
<li><b>Leia o comando antes do texto</b> nas questões longas.</li>
</ol>
<div class="tablewrap"><table class="grid"><thead><tr><th>Dia</th><th>Conteúdo</th><th>Tempo</th><th>Referência</th></tr></thead><tbody>
<tr><td>1º dia</td><td>Linguagens (45) + Humanas (45) + Redação</td><td>5h30</td><td>cerca de 1h10 para a redação e 2,5 min por questão</td></tr>
<tr><td>2º dia</td><td>Natureza (45) + Matemática (45)</td><td>5h</td><td>cerca de 3 min por questão</td></tr>
</tbody></table></div>
<p class="small">Use os simulados das semanas finais para testar a ordem que funciona melhor para você (por exemplo, fazer a redação no começo, com a cabeça descansada, ou depois das questões).</p></section>

<section id="met-saude"><h2>Constância e saúde</h2>
<ul>
<li><b>Sono:</b> 7 a 9 horas. Virar a noite estudando piora a memória do dia seguinte.</li>
<li><b>Exercício:</b> 20 a 30 minutos de caminhada ou outra atividade na maioria dos dias melhora atenção e humor.</li>
<li><b>Celular:</b> fora do alcance durante os blocos. Notificação no meio do bloco quebra a concentração.</li>
<li><b>Quando atrasar:</b> não tente compensar estudando 10 horas num dia. A agenda empurra as aulas sozinha e mostra se você continua dentro do limite.</li>
<li><b>Ansiedade:</b> ansiedade antes de provas é comum. Respiração lenta (inspirar em 4 tempos, soltar em 6) ajuda. Se estiver atrapalhando o sono ou o dia a dia, procure a unidade básica de saúde do seu bairro ou o CVV (ligue 188, gratuito, 24 horas).</li>
<li><b>Motivação:</b> compare você com você mesmo. Olhe a barra de progresso e as notas dos simulados ao longo dos meses.</li>
</ul></section>

<section id="met-erros"><h2>Erros comuns de quem recomeça</h2>
<ul>
<li>Só assistir vídeos e nunca fazer exercícios.</li>
<li>Reler e grifar no lugar de se testar.</li>
<li>Pular as revisões porque "já entendi".</li>
<li>Estudar só as matérias de que gosta.</li>
<li>Deixar a redação para depois.</li>
<li>Não corrigir os exercícios ou não anotar os erros.</li>
<li>Ficar meses sem fazer uma prova completa do ENEM.</li>
</ul></section>

    ['Desprezando a resistência do ar, uma bola de ferro e uma bola de borracha do mesmo tamanho, soltas da mesma altura, chegam ao chão:', ['ao mesmo tempo', 'primeiro a de ferro, por ser mais pesada', 'primeiro a de borracha', 'depende da cor', 'nunca chegam'], 'Sem ar, todos os corpos caem com a mesma aceleração (g ≈ 10 m/s²), independente da massa. Galileu mostrou isso; na Lua, um martelo e uma pena caem juntos.']
  ],
  f05b: [
    ['No lançamento oblíquo (sem resistência do ar), a componente horizontal da velocidade:', ['permanece constante', 'aumenta até o ponto mais alto', 'é zero no ponto mais alto', 'diminui até zero', 'muda de sentido'], 'Na horizontal não há força agindo (sem ar), então o movimento é uniforme. Só a componente vertical muda, por causa da gravidade.'],
    ['No ponto mais alto da trajetória de um lançamento oblíquo, a velocidade vertical é:', ['zero', 'máxima', 'igual à horizontal', 'igual à inicial', 'negativa e máxima'], 'No topo, o corpo para de subir e começa a descer: a velocidade vertical é zero. A horizontal continua existindo, por isso o corpo não para totalmente.']
  ],
  f06: [
    ['Duas polias ligadas por uma correia (sem deslizar) têm, nos pontos da correia, a mesma:', ['velocidade linear', 'frequência de rotação', 'velocidade angular', 'quantidade de dentes', 'massa'], 'A correia passa pelas duas com a mesma velocidade linear. Por isso a polia menor gira mais rápido (maior frequência), como na bicicleta.'],
    ['Uma roda dá 120 voltas por minuto. Qual é sua frequência em hertz (voltas por segundo)?', ['2 Hz', '120 Hz', '60 Hz', '0,5 Hz', '7.200 Hz'], 'Hertz = voltas por segundo. 120 voltas ÷ 60 s = 2 Hz. O período (tempo de uma volta) é 1 ÷ 2 = 0,5 s.']
  ],
  f07: [
    ['Segundo a 1ª Lei de Newton (inércia), um corpo em movimento retilíneo uniforme, sem forças resultantes:', ['continua em movimento retilíneo uniforme', 'para imediatamente', 'acelera sempre', 'passa a fazer curvas', 'cai no chão'], 'Inércia: sem força resultante, o corpo mantém seu estado (repouso ou MRU). É por isso que usamos cinto de segurança: numa freada, o corpo tende a continuar.'],
    ['Uma força resultante de 20 N age sobre um corpo de 4 kg. Qual é a aceleração dele?', ['5 m/s²', '80 m/s²', '24 m/s²', '16 m/s²', '0,2 m/s²'], '2ª Lei de Newton: F = m · a → a = F ÷ m = 20 ÷ 4 = 5 m/s².']
  ],
  f08: [
    ['Uma mola de constante elástica 200 N/m é esticada 0,1 m. Qual é a força elástica?', ['20 N', '2.000 N', '200 N', '2 N', '0,05 N'], 'Lei de Hooke: F = k · x = 200 × 0,1 = 20 N. Quanto mais se estica (dentro do limite), maior a força.'],
    ['O atrito entre os pneus e o asfalto é importante porque:', ['permite que o carro acelere, freie e faça curvas', 'só atrapalha o movimento', 'aumenta a massa do carro', 'diminui a gravidade', 'não tem efeito nenhum'], 'Sem atrito os pneus girariam em falso, como no gelo. O atrito estático é o que "empurra" o carro para frente e permite frear.']
  ],
  f08b: [
    ['Num plano inclinado sem atrito, o que faz o bloco descer?', ['A componente do peso paralela ao plano', 'A força normal', 'A massa do bloco sozinha', 'A componente do peso perpendicular ao plano', 'A resistência do ar'], 'O peso se divide em duas partes: uma perpendicular ao plano (equilibrada pela normal) e outra paralela, P · sen θ, que puxa o bloco ladeira abaixo.'],
    ['Quanto mais inclinado o plano (sem atrito), a aceleração do bloco que desce:', ['aumenta', 'diminui', 'fica igual', 'vira zero', 'muda de sentido'], 'A aceleração vale g · sen θ. Quanto maior o ângulo θ, maior o seno e maior a aceleração. Com 90° é queda livre (a = g).']
  ],
  f09: [
    ['Qual é a energia cinética de um corpo de 2 kg a 3 m/s?', ['9 J', '6 J', '18 J', '3 J', '12 J'], 'Ec = m · v² ÷ 2 = 2 × 9 ÷ 2 = 9 J. A velocidade entra ao quadrado: dobrar a velocidade quadruplica a energia.'],
    ['Numa usina hidrelétrica, a principal transformação de energia é:', ['potencial gravitacional → cinética → elétrica', 'química → térmica → elétrica', 'nuclear → térmica → elétrica', 'elétrica → luminosa', 'solar → química'], 'A água guardada no alto tem energia potencial; ao descer, vira cinética, gira as turbinas e o gerador transforma em energia elétrica.']
  ],
  f10: [
    ['Qual é a quantidade de movimento de um corpo de 5 kg a 4 m/s?', ['20 kg·m/s', '9 kg·m/s', '40 kg·m/s', '1,25 kg·m/s', '80 kg·m/s'], 'Quantidade de movimento: Q = m · v = 5 × 4 = 20 kg·m/s. É uma grandeza vetorial, com o mesmo sentido da velocidade.'],
    ['Por que o airbag reduz lesões numa batida?', ['Aumenta o tempo de parada, diminuindo a força', 'Diminui a massa do passageiro', 'Aumenta a velocidade do carro', 'Elimina a quantidade de movimento sem força', 'Aumenta a força sobre o passageiro'], 'O impulso (F · Δt) necessário para parar é o mesmo. Se o tempo de parada aumenta, a força média diminui. O mesmo vale para dobrar os joelhos ao pular.']
  ],
  f11: [
    ['Numa gangorra, uma criança de 30 kg está a 2 m do apoio. A que distância do apoio uma criança de 20 kg deve sentar para equilibrar?', ['3 m', '2 m', '1,3 m', '4 m', '1 m'], 'Equilíbrio de momentos: 30 × 2 = 20 × d → d = 60 ÷ 20 = 3 m. Quem é mais leve precisa ficar mais longe do apoio.'],
    ['Por que é mais fácil abrir uma porta empurrando perto da maçaneta do que perto das dobradiças?', ['A distância até o eixo é maior, gerando mais torque', 'A porta fica mais leve nesse ponto', 'A maçaneta diminui o atrito', 'A força peso é menor ali', 'Não há diferença real'], 'Torque (momento) = força × distância ao eixo. Com distância maior, a mesma força produz mais efeito de rotação. É o princípio da alavanca.']
  ],
  f12: [
    ['Segundo a Lei da Gravitação Universal, se a distância entre dois corpos dobra, a força gravitacional entre eles:', ['fica 4 vezes menor', 'fica 2 vezes menor', 'dobra', 'quadruplica', 'não muda'], 'F = G · M · m ÷ d². A distância está ao quadrado no denominador: dobrar d divide a força por 2² = 4.'],
    ['A 1ª Lei de Kepler afirma que as órbitas dos planetas ao redor do Sol são:', ['elipses, com o Sol em um dos focos', 'círculos perfeitos, com o Sol no centro', 'retas', 'espirais', 'quadradas'], 'Kepler mostrou que as órbitas são elípticas. Por isso a distância Terra–Sol varia um pouco ao longo do ano (mas não é isso que causa as estações).']
  ],
  f13: [
    ['Por que um navio de aço, muito pesado, flutua?', ['Porque desloca um volume de água cujo peso equilibra o seu (empuxo)', 'Porque o aço é menos denso que a água', 'Porque a água é mais pesada que o navio inteiro', 'Porque a gravidade não age no mar', 'Porque o casco é magnetizado'], 'Princípio de Arquimedes: o empuxo é igual ao peso do líquido deslocado. O casco é oco e cheio de ar, então a densidade média do navio é menor que a da água.'],
    ['Um mergulhador desce de 10 m para 20 m de profundidade. A pressão da água sobre ele:', ['aumenta', 'diminui', 'continua igual', 'vira zero', 'depende só da temperatura'], 'Teorema de Stevin: a pressão aumenta com a profundidade (p = p₀ + d · g · h). A cada 10 m de água, soma-se cerca de 1 atmosfera.']
  ],
  f14: [
    ['Qual temperatura em Celsius corresponde a 212 °F (ponto de ebulição da água ao nível do mar)?', ['100 °C', '212 °C', '180 °C', '0 °C', '32 °C'], 'Relação: C/5 = (F − 32)/9 → C = 5 × (212 − 32) ÷ 9 = 5 × 180 ÷ 9 = 100 °C. Água: congela a 0 °C (32 °F) e ferve a 100 °C (212 °F).'],
    ['Por que trilhos de trem e pontes têm pequenos espaços (juntas) entre as partes?', ['Para permitir a dilatação térmica no calor', 'Para economizar material', 'Para escoar a água da chuva', 'Para diminuir o barulho', 'Por enfeite'], 'Os metais dilatam quando esquentam. Sem as juntas, os trilhos se entortariam nos dias quentes.']
  ],
  f14a: [
    ['Qual é a diferença entre calor e temperatura?', ['Calor é energia em trânsito; temperatura mede a agitação das partículas', 'São a mesma coisa', 'Temperatura é energia em trânsito; calor mede a agitação', 'Calor só existe no verão', 'Temperatura é medida em calorias'], 'Temperatura indica o grau de agitação das moléculas. Calor é a energia que passa do corpo mais quente para o mais frio até igualar as temperaturas.'],
    ['O ar quente de um aquecedor sobe e o ar frio desce, circulando pelo cômodo. Esse processo é a:', ['convecção', 'condução', 'irradiação', 'dilatação', 'evaporação'], 'Convecção acontece em líquidos e gases: a parte quente fica menos densa e sobe. Condução é de partícula a partícula (colher na panela); irradiação é por ondas (calor do Sol).']
  ],
  f15: [
    ['Quantas calorias são necessárias para aquecer 200 g de água de 20 °C para 50 °C? (calor específico da água = 1 cal/g·°C)', ['6.000 cal', '200 cal', '10.000 cal', '4.000 cal', '30 cal'], 'Calor sensível: Q = m · c · ΔT = 200 × 1 × (50 − 20) = 200 × 30 = 6.000 cal.'],
    ['Enquanto o gelo está derretendo (0 °C, ao nível do mar), recebendo calor, sua temperatura:', ['permanece constante', 'aumenta sem parar', 'diminui', 'oscila', 'cai abaixo de zero'], 'Durante a mudança de estado, o calor recebido (calor latente) é usado para romper as ligações entre as moléculas, não para aumentar a temperatura.']
  ],
  f16: [
    ['Por que panelas costumam ter cabo de madeira ou plástico?', ['São maus condutores de calor (isolantes)', 'São bons condutores de calor', 'Deixam a panela mais leve para cozinhar', 'Aumentam a temperatura da comida', 'Conduzem eletricidade'], 'Madeira e plástico conduzem mal o calor, protegendo a mão. O metal da panela, ao contrário, conduz bem e leva o calor do fogo até o alimento.'],
    ['Numa garrafa térmica, a parede espelhada serve principalmente para reduzir a troca de calor por:', ['irradiação', 'condução', 'convecção', 'evaporação', 'compressão'], 'O espelho reflete as ondas de calor (radiação infravermelha). O vácuo entre as paredes reduz a condução e a convecção, e a tampa evita a convecção com o ar externo.']
  ],
  f17: [
    ['Numa transformação isotérmica de um gás ideal, se o volume cai pela metade, a pressão:', ['dobra', 'cai pela metade', 'fica igual', 'quadruplica', 'vira zero'], 'Isotérmica = temperatura constante. Lei de Boyle: p · V = constante. Se V cai pela metade, p dobra.'],
    ['Por que não se deve aquecer um desodorante aerossol fechado?', ['A pressão do gás aumenta com a temperatura e a lata pode explodir', 'O gás perde todas as moléculas', 'O volume da lata aumenta muito sem perigo', 'O gás vira sólido', 'A pressão diminui e a lata amassa'], 'Com volume constante, a pressão de um gás é proporcional à temperatura absoluta (p/T = constante). Aquecer aumenta a pressão até romper a lata.']
  ],
  f18: [
    ['A 1ª Lei da Termodinâmica é uma forma de expressar:', ['a conservação da energia', 'que o calor passa do frio para o quente sozinho', 'que todo motor tem rendimento de 100%', 'a lei da inércia', 'a lei de Ohm'], 'ΔU = Q − W: a energia recebida como calor vira variação de energia interna e/ou trabalho. Nada se cria do nada.'],
    ['Por que nenhuma máquina térmica tem rendimento de 100%?', ['Parte do calor sempre é rejeitada para a fonte fria (2ª Lei)', 'Por falta de óleo lubrificante apenas', 'Porque o calor não realiza trabalho', 'Porque a energia é destruída', 'Porque as máquinas são feitas de metal'], 'A 2ª Lei da Termodinâmica diz que é impossível transformar todo o calor em trabalho num ciclo: parte sempre vai para a fonte fria (o escapamento do carro, por exemplo).']
  ],
  f19: [
    ['Uma camiseta parece vermelha sob luz branca porque:', ['reflete principalmente a luz vermelha e absorve as outras cores', 'absorve a luz vermelha', 'emite luz vermelha própria', 'reflete todas as cores igualmente', 'não reflete luz nenhuma'], 'A cor que vemos é a que o objeto reflete. Um objeto branco reflete todas as cores; um preto absorve quase todas.'],
    ['A formação de sombras é uma evidência de que a luz:', ['se propaga em linha reta', 'faz curvas ao redor dos objetos', 'é um som', 'precisa de ar para existir', 'é mais lenta que o som'], 'Propagação retilínea da luz: o objeto opaco bloqueia os raios e forma a sombra atrás dele. Eclipses são sombras em escala astronômica.']
  ],
  f20: [
    ['Um lápis dentro de um copo com água parece "quebrado". Esse fenômeno é a:', ['refração da luz', 'reflexão da luz', 'difração do som', 'dilatação da água', 'polarização'], 'Refração: a luz muda de velocidade ao passar da água para o ar e desvia sua direção. Por isso a imagem do lápis parece deslocada.'],
    ['Que tipo de lente corrige a miopia?', ['Lente divergente', 'Lente convergente', 'Lente bifocal sempre', 'Espelho côncavo', 'Lente plana'], 'No olho míope a imagem se forma antes da retina. A lente divergente "abre" os raios e empurra a imagem para a retina. Hipermetropia se corrige com lente convergente.']
  ],
  f21: [
    ['Uma onda tem frequência de 5 Hz e comprimento de onda de 2 m. Qual é sua velocidade?', ['10 m/s', '2,5 m/s', '7 m/s', '0,4 m/s', '3 m/s'], 'Equação fundamental da ondulatória: v = λ · f = 2 × 5 = 10 m/s.'],
    ['Qual destas ondas consegue se propagar no vácuo?', ['A luz', 'O som', 'As ondas do mar', 'Uma onda numa corda', 'A onda de um terremoto'], 'A luz é uma onda eletromagnética e não precisa de meio material. Som, ondas do mar e da corda são ondas mecânicas: precisam de um meio.']
  ],
  f22: [
    ['O que diferencia um som agudo de um som grave?', ['A frequência (agudo tem frequência maior)', 'A intensidade (agudo é mais alto)', 'O timbre apenas', 'A velocidade no ar', 'A cor do som'], 'Altura do som = frequência. Agudo: frequência alta (fino). Grave: frequência baixa (grosso). Volume alto ou baixo é a intensidade.'],
    ['O eco acontece porque o som:', ['reflete num obstáculo e volta até nós', 'se propaga no vácuo', 'muda de frequência sozinho', 'é absorvido totalmente', 'vira luz'], 'Eco é a reflexão do som. Morcegos e sonares usam o tempo de volta do som para calcular distâncias.']
  ],
  f23: [
    ['Ao atritar um canudo plástico num papel, o canudo passa a atrair pedacinhos de papel. Isso ocorre porque:', ['o canudo ficou eletrizado por atrito', 'o canudo virou um ímã', 'o papel perdeu massa', 'surgiu uma corrente elétrica contínua', 'o ar ficou mais denso'], 'No atrito, elétrons passam de um material para o outro: os dois ficam com cargas opostas. O corpo eletrizado atrai corpos leves neutros por indução.'],
    ['Cargas elétricas de mesmo sinal:', ['se repelem', 'se atraem', 'se anulam sempre', 'não interagem', 'se transformam em nêutrons'], 'Sinais iguais se repelem, sinais opostos se atraem. A força é dada pela Lei de Coulomb e diminui com o quadrado da distância.']
  ],
  f24: [
    ['Um resistor de 10 Ω é ligado a uma tensão de 20 V. Qual é a corrente?', ['2 A', '200 A', '0,5 A', '30 A', '10 A'], 'Lei de Ohm: U = R · i → i = U ÷ R = 20 ÷ 10 = 2 A.'],
    ['Em casa, as tomadas e lâmpadas são ligadas em paralelo porque assim:', ['cada aparelho recebe a mesma tensão e funciona de forma independente', 'a corrente é igual em todos', 'se um queimar, todos apagam', 'gasta-se menos energia sempre', 'a tensão se divide entre eles'], 'Em paralelo, todos recebem a tensão da rede (127 V ou 220 V) e um aparelho desligado não interrompe os outros. Em série (pisca-pisca antigo), um queimado apagava tudo.']
  ],
  f25: [
    ['Um chuveiro de 5.000 W (5 kW) fica ligado 2 horas. Quanta energia consome?', ['10 kWh', '2,5 kWh', '7 kWh', '10.000 kWh', '5 kWh'], 'Energia = potência × tempo = 5 kW × 2 h = 10 kWh. A conta de luz cobra por kWh.'],
    ['O aquecimento de um chuveiro elétrico se baseia em qual efeito?', ['Efeito Joule', 'Efeito estufa', 'Efeito Doppler', 'Efeito fotoelétrico', 'Efeito magnético'], 'Efeito Joule: a corrente elétrica, ao atravessar o resistor, transforma energia elétrica em calor. Também acontece no ferro de passar e na torradeira.']
  ],
  f26: [
    ['Ao cortar um ímã ao meio, obtém-se:', ['dois ímãs menores, cada um com polo norte e polo sul', 'um polo norte separado de um polo sul', 'dois pedaços sem magnetismo', 'um ímã e um pedaço de ferro comum', 'dois polos norte'], 'Não existe polo magnético isolado: cada pedaço, por menor que seja, continua tendo norte e sul.'],
    ['O funcionamento de usinas geradoras de eletricidade se baseia na indução eletromagnética, que consiste em:', ['produzir corrente elétrica ao variar o campo magnético numa bobina', 'transformar calor diretamente em luz', 'carregar baterias com ímãs parados', 'criar ímãs com corrente contínua apenas', 'eliminar o atrito nas turbinas'], 'Faraday descobriu que mover um ímã perto de uma bobina (ou girar a bobina num campo) gera corrente. É o princípio dos geradores das usinas e dos dínamos.']
  ],
  f27: [
    ['O efeito fotoelétrico, explicado por Einstein, mostrou que a luz:', ['também se comporta como partícula (fóton)', 'é só uma onda mecânica', 'não carrega energia', 'precisa de ar para se propagar', 'é mais lenta que o som'], 'A luz arranca elétrons de metais em "pacotes" de energia (fótons), cuja energia depende da frequência. Isso deu a Einstein o Nobel e é a base das placas solares.'],
    ['A luz do Sol leva cerca de 8 minutos para chegar à Terra. Isso significa que, ao olharmos o Sol:', ['vemos como ele era 8 minutos antes', 'vemos o Sol do futuro', 'a luz chega instantaneamente', 'vemos o Sol de 8 anos atrás', 'a luz não viaja pelo espaço'], 'A luz tem velocidade finita (cerca de 300.000 km/s). Estrelas distantes podem ser vistas como eram há milhares de anos.']
  ],
  f02: [
    ['Duas forças de 3 N e 4 N agem sobre um corpo, perpendiculares entre si. Qual é a força resultante?', ['5 N', '7 N', '1 N', '12 N', '25 N'], 'Forças perpendiculares formam um triângulo retângulo: R² = 3² + 4² = 25 → R = 5 N (Pitágoras).'],
    ['Duas forças de 6 N e 2 N agem na mesma direção, mas em sentidos opostos. Qual é a resultante?', ['4 N, no sentido da força maior', '8 N', '12 N', '3 N', 'zero'], 'Sentidos opostos: subtraia. 6 − 2 = 4 N, no sentido da força de 6 N. No mesmo sentido, somaria (8 N).']
  ],

  q01: [
    ['A passagem da água do estado líquido para o gasoso chama-se:', ['vaporização', 'fusão', 'solidificação', 'condensação', 'sublimação'], 'Fusão: sólido → líquido. Vaporização: líquido → gás. Condensação: gás → líquido. Solidificação: líquido → sólido. Sublimação: sólido → gás direto (naftalina, gelo-seco).'],
    ['Qual destas é uma propriedade específica da matéria, que ajuda a identificar uma substância?', ['Ponto de ebulição', 'Massa', 'Volume', 'Comprimento', 'Formato'], 'Massa e volume dependem da quantidade (propriedades gerais). Ponto de fusão, ebulição e densidade são característicos de cada substância pura.']
  ],
  q02: [
    ['Um objeto tem massa de 300 g e volume de 100 cm³. Qual é sua densidade?', ['3 g/cm³', '30.000 g/cm³', '0,33 g/cm³', '200 g/cm³', '400 g/cm³'], 'Densidade = massa ÷ volume = 300 ÷ 100 = 3 g/cm³. Como é maior que a da água (1 g/cm³), ele afunda.'],
    ['O óleo de cozinha fica por cima da água num copo porque:', ['é menos denso que a água', 'é mais denso que a água', 'é mais pesado', 'tem a mesma densidade', 'é um sólido'], 'O líquido menos denso fica em cima. Óleo e água também não se misturam (polar × apolar), formando duas fases.']
  ],
  q03: [
    ['Água com sal dissolvido é um exemplo de:', ['mistura homogênea', 'substância pura simples', 'mistura heterogênea', 'substância composta', 'elemento químico'], 'O sal se dissolve e a mistura fica com uma só fase visível: homogênea (solução). Água com areia seria heterogênea.'],
    ['Qual processo separa a água do sal numa salina?', ['Evaporação', 'Filtração', 'Decantação', 'Peneiração', 'Imantação'], 'O sol evapora a água e o sal fica. Filtração separa sólido não dissolvido de líquido (café no coador); decantação separa por diferença de densidade.']
  ],
  q04: [
    ['O modelo atômico que ficou conhecido como "pudim de passas" foi proposto por:', ['Thomson', 'Dalton', 'Rutherford', 'Bohr', 'Demócrito'], 'Thomson (1897) descobriu o elétron e imaginou o átomo como uma massa positiva com elétrons espalhados. Dalton: bola maciça. Rutherford: núcleo e eletrosfera. Bohr: camadas de energia.'],
    ['Um átomo neutro tem 11 prótons e 12 nêutrons. Quantos elétrons e qual o número de massa?', ['11 elétrons; massa 23', '12 elétrons; massa 23', '11 elétrons; massa 12', '23 elétrons; massa 11', '12 elétrons; massa 11'], 'Átomo neutro: elétrons = prótons = 11. Número de massa A = prótons + nêutrons = 11 + 12 = 23 (é o sódio).']
  ],
  q05: [
    ['Qual é a distribuição eletrônica (em camadas K, L, M) de um átomo com 11 elétrons?', ['K = 2, L = 8, M = 1', 'K = 2, L = 9', 'K = 8, L = 2, M = 1', 'K = 1, L = 8, M = 2', 'K = 2, L = 2, M = 7'], 'A camada K comporta 2 elétrons e a L, 8. Sobra 1 para a M. Esse elétron sozinho na última camada explica por que o sódio forma o íon Na⁺.'],
    ['Os elétrons da camada mais externa de um átomo são chamados de:', ['elétrons de valência', 'nêutrons livres', 'prótons externos', 'núcleons', 'íons'], 'Elétrons de valência ficam na última camada e participam das ligações químicas. Eles definem a família na tabela periódica.']

  ],
  h02: [
    ['As primeiras civilizações, como a Mesopotâmia e o Egito, surgiram perto de grandes rios porque:', ['os rios permitiam irrigação, agricultura e transporte', 'os rios protegiam do frio', 'não havia desertos na região', 'os rios tinham ouro em abundância', 'os povos viviam da pesca exclusivamente'], 'Tigre e Eufrates (Mesopotâmia) e Nilo (Egito) forneciam água e solo fértil com as cheias. Por isso são chamadas civilizações hidráulicas ou de regadio.'],
    ['O Código de Hamurábi, da Mesopotâmia, é conhecido por:', ['ser um dos primeiros conjuntos de leis escritas, baseado no "olho por olho, dente por dente"', 'ser a Bíblia dos hebreus', 'criar a democracia', 'ser o primeiro alfabeto', 'organizar as pirâmides do Egito'], 'Hamurábi, rei da Babilônia, mandou gravar as leis em pedra. A Lei de Talião previa punições proporcionais ao dano, variando conforme a camada social.']
  ],
  h03: [
    ['Na democracia de Atenas, na Grécia antiga, quem podia participar das decisões políticas?', ['Apenas os cidadãos: homens adultos, livres, filhos de atenienses', 'Todos os moradores, inclusive mulheres e escravizados', 'Apenas o rei', 'Somente os estrangeiros ricos', 'Apenas os sacerdotes'], 'A democracia ateniense era direta, mas excludente: mulheres, estrangeiros (metecos) e escravizados não votavam. A maioria da população ficava de fora.'],
    ['Esparta, cidade-Estado grega rival de Atenas, era conhecida por:', ['ser uma sociedade militarizada, voltada para a guerra', 'ser o berço da democracia', 'ter abolido a escravidão', 'ser governada por filósofos', 'não ter exército'], 'Os meninos espartanos eram treinados para a guerra desde os 7 anos. A sociedade era oligárquica e dependia do trabalho dos hilotas.']
  ],
  h04: [
    ['O "pão e circo" na Roma antiga era uma política para:', ['distribuir alimento e espetáculos e assim conter revoltas da plebe', 'educar os escravizados', 'acabar com as guerras', 'promover a democracia direta', 'expandir o cristianismo'], 'Os governantes distribuíam trigo e promoviam lutas de gladiadores para manter a população pobre de Roma satisfeita e controlada.'],
    ['Qual foi a sequência das formas de governo da Roma antiga?', ['Monarquia, República e Império', 'Império, Monarquia e República', 'República, Monarquia e Império', 'Democracia, Monarquia e Império', 'Feudalismo, República e Monarquia'], 'Roma foi monarquia (753–509 a.C.), república com Senado e cônsules (509–27 a.C.) e império a partir de Otávio Augusto (27 a.C.).']
  ],
  h05: [
    ['No feudalismo, a relação entre suserano e vassalo era baseada em:', ['troca de terras (feudo) por fidelidade e serviço militar', 'pagamento de salários', 'eleições livres', 'comércio marítimo', 'igualdade de direitos'], 'O suserano cedia terras ao vassalo, que jurava fidelidade e lhe prestava ajuda militar. Os servos trabalhavam a terra e pagavam obrigações.'],
    ['A instituição mais poderosa da Europa medieval, que influenciava a cultura e a política, era:', ['a Igreja Católica', 'o Parlamento inglês', 'as universidades públicas', 'os bancos', 'os sindicatos'], 'A Igreja tinha terras, cobrava dízimos, controlava a educação e influenciava reis. O teocentrismo (Deus no centro) marcava o pensamento da época.']
  ],
  h06: [
    ['O renascimento comercial e urbano da Baixa Idade Média foi impulsionado, entre outros fatores, por:', ['as Cruzadas, que reabriram rotas de comércio no Mediterrâneo', 'o fim da agricultura', 'a descoberta do petróleo', 'a Revolução Industrial', 'a chegada dos portugueses ao Brasil'], 'As Cruzadas aproximaram Europa e Oriente, reativaram o comércio e fizeram crescer as feiras e cidades (burgos), onde surgiu a burguesia.'],
    ['A crise do século XIV na Europa foi marcada por:', ['fome, Peste Negra e Guerra dos Cem Anos', 'grande prosperidade e paz', 'descoberta da América', 'Revolução Francesa', 'fim da Igreja Católica'], 'A Peste Negra matou cerca de um terço da população europeia. Fome e guerras agravaram a crise e enfraqueceram o feudalismo.']
  ],
  h07: [
    ['A Reforma Protestante, iniciada por Martinho Lutero em 1517, criticava principalmente:', ['a venda de indulgências pela Igreja Católica', 'a monarquia inglesa', 'o comércio com o Oriente', 'a escravidão africana', 'as navegações portuguesas'], 'Lutero publicou 95 teses contra abusos da Igreja, como a venda do perdão dos pecados. Defendia a salvação pela fé e a leitura da Bíblia pelos fiéis.'],
    ['O mercantilismo, política econômica dos Estados absolutistas, defendia:', ['acumular metais preciosos e manter a balança comercial favorável', 'o livre comércio sem interferência do Estado', 'a divisão das terras entre os camponeses', 'o fim das colônias', 'a economia socialista'], 'Metalismo, balança comercial favorável (exportar mais que importar), protecionismo e exploração colonial eram as bases do mercantilismo.']
  ],
  h08: [
    ['Qual povo pré-colombiano construiu a cidade de Tenochtitlán, onde hoje é a Cidade do México?', ['Astecas', 'Incas', 'Maias', 'Tupis', 'Guaranis'], 'Os astecas fundaram Tenochtitlán sobre um lago. Os incas dominavam os Andes (capital Cusco) e os maias ocupavam a península de Iucatã.'],
    ['Além das armas de fogo, um fator decisivo para a conquista espanhola da América foi:', ['as doenças trazidas pelos europeus, como a varíola', 'a superioridade numérica dos espanhóis', 'a ausência de cidades na América', 'o apoio dos portugueses', 'a falta de exércitos indígenas'], 'Os indígenas não tinham imunidade às doenças europeias, que mataram milhões. Os espanhóis também se aliaram a povos rivais dos astecas e incas.']
  ],
  h09: [
    ['As capitanias hereditárias, criadas em 1534, consistiam em:', ['faixas de terra doadas a donatários, que deviam colonizá-las com recursos próprios', 'cidades fundadas pelos indígenas', 'quilombos organizados', 'províncias do Império', 'fazendas de café do século XIX'], 'Portugal dividiu o Brasil em lotes entregues a nobres e comerciantes. A maioria fracassou, e em 1548 foi criado o Governo-Geral.'],
    ['A primeira atividade econômica explorada pelos portugueses no Brasil foi:', ['a extração do pau-brasil com trabalho indígena por escambo', 'a mineração de ouro', 'o cultivo de café', 'a produção de borracha', 'a pecuária no Sul'], 'O pau-brasil fornecia tinta vermelha para tecidos. Os indígenas cortavam a madeira em troca de objetos (escambo).']
  ],
  h10: [
    ['A economia açucareira no Brasil colonial se baseava em:', ['latifúndio, monocultura, mão de obra escravizada e exportação', 'pequenas propriedades familiares', 'trabalho assalariado europeu', 'produção para o mercado interno apenas', 'cooperativas indígenas'], 'O "plantation" açucareiro: grandes propriedades, um único produto, trabalho de africanos escravizados e venda para a Europa.'],
    ['O Quilombo dos Palmares, liderado por Zumbi, é símbolo de:', ['resistência dos africanos escravizados', 'aliança entre colonos e holandeses', 'exploração do ouro', 'catequese jesuítica', 'independência do Brasil'], 'Palmares, na Serra da Barriga (AL), resistiu por quase um século. O 20 de novembro, dia da morte de Zumbi (1695), é o Dia da Consciência Negra.']
  ],
  h11: [
    ['A União Ibérica (1580–1640) foi o período em que:', ['Portugal e suas colônias ficaram sob o domínio do rei da Espanha', 'o Brasil se tornou independente', 'a Espanha passou ao domínio português', 'os holandeses governaram Portugal', 'a escravidão foi abolida'], 'Com a morte do rei português sem herdeiros, Filipe II da Espanha assumiu o trono. Na prática, o Tratado de Tordesilhas perdeu efeito, facilitando a expansão para o interior.'],
    ['Os holandeses ocuparam parte do Nordeste brasileiro no século XVII principalmente porque:', ['queriam controlar a produção e o comércio do açúcar', 'buscavam ouro em Minas', 'queriam catequizar os indígenas', 'fugiam da Revolução Francesa', 'queriam plantar café'], 'Os holandeses financiavam e refinavam o açúcar brasileiro. Com a União Ibérica, a Espanha (inimiga da Holanda) cortou esse comércio, e eles invadiram Pernambuco.']
  ],
  h12: [
    ['A descoberta de ouro em Minas Gerais, no fim do século XVII, provocou:', ['grande migração, urbanização e deslocamento do centro econômico para o Sudeste', 'o fim imediato da escravidão', 'a independência do Brasil', 'o abandono total do litoral', 'a queda da população'], 'Vieram milhares de portugueses e africanos escravizados. Surgiram cidades como Vila Rica (Ouro Preto) e a capital foi transferida para o Rio de Janeiro em 1763.'],
    ['O quinto, cobrado por Portugal na mineração, era:', ['um imposto de 20% sobre o ouro extraído', 'a quinta parte das terras indígenas', 'um feriado religioso', 'um tipo de moeda', 'o quinto filho do minerador'], 'A Coroa ficava com 1/5 do ouro. A cobrança abusiva (como a derrama) gerou revoltas, entre elas a Inconfidência Mineira.']
  ],
  h13: [
    ['O Iluminismo, movimento do século XVIII, defendia:', ['a razão, a liberdade e críticas ao absolutismo', 'o poder absoluto dos reis por direito divino', 'o fim da ciência', 'o retorno ao feudalismo', 'a obediência cega à Igreja'], 'Pensadores como Locke, Montesquieu, Voltaire e Rousseau defendiam direitos naturais, separação de poderes e liberdade de expressão.'],
    ['Montesquieu é conhecido por propor:', ['a divisão do poder em Executivo, Legislativo e Judiciário', 'o poder absoluto do rei', 'o fim da propriedade privada', 'a ditadura do proletariado', 'a monarquia sem leis'], 'Em "O Espírito das Leis", Montesquieu defendeu os três poderes independentes que se controlam mutuamente, base das constituições modernas.']
  ],
  h14: [
    ['A Revolução Industrial começou na Inglaterra, no século XVIII, e teve como marca:', ['a máquina a vapor e a produção em fábricas', 'a invenção da internet', 'o uso do petróleo como principal fonte de energia', 'o fim do trabalho assalariado', 'a agricultura de subsistência'], 'A Inglaterra tinha carvão, capital acumulado e mão de obra vinda do campo. O trabalho artesanal deu lugar às fábricas com máquinas.'],
    ['Os trabalhadores das primeiras fábricas inglesas enfrentavam:', ['jornadas de até 16 horas, baixos salários e trabalho infantil', 'jornada de 8 horas e férias remuneradas', 'aposentadoria garantida', 'salários altíssimos', 'proteção total das leis trabalhistas'], 'As péssimas condições levaram ao surgimento de movimentos operários, como o ludismo (quebra de máquinas), o cartismo e os sindicatos.']
  ],
  h15: [
    ['O lema da Revolução Francesa (1789) era:', ['Liberdade, Igualdade e Fraternidade', 'Ordem e Progresso', 'Paz, Terra e Pão', 'Deus, Pátria e Família', 'Trabalho e Família'], 'A Revolução Francesa derrubou o Antigo Regime e proclamou a Declaração dos Direitos do Homem e do Cidadão. "Ordem e Progresso" é o lema positivista da bandeira do Brasil.'],
    ['O Bloqueio Continental, decretado por Napoleão em 1806, proibia os países europeus de:', ['comercializar com a Inglaterra', 'comercializar com a França', 'usar moeda própria', 'ter exércitos', 'colonizar a África'], 'Napoleão queria enfraquecer a economia inglesa. Portugal não aderiu, foi invadido, e a família real fugiu para o Brasil em 1808.']
  ],
  h16: [
    ['A Inconfidência Mineira (1789) foi motivada principalmente:', ['pela cobrança abusiva de impostos sobre o ouro (derrama)', 'pela abolição da escravidão', 'pela proclamação da República', 'pela chegada da família real', 'pela invasão holandesa'], 'A elite mineira planejou se rebelar quando seria feita a derrama. O movimento foi denunciado e Tiradentes foi enforcado em 1792.'],
    ['Qual revolta colonial teve forte participação popular, com alfaiates, soldados e escravizados, e defendia o fim da escravidão?', ['Conjuração Baiana (1798)', 'Inconfidência Mineira', 'Guerra dos Emboabas', 'Revolta de Beckman', 'Guerra dos Mascates'], 'A Conjuração Baiana (Revolta dos Alfaiates), em Salvador, foi a mais popular das revoltas coloniais e propunha república, igualdade e abolição.']
  ],
  h17: [
    ['A vinda da família real portuguesa para o Brasil, em 1808, trouxe como consequência:', ['a abertura dos portos às nações amigas e a criação de instituições no Rio de Janeiro', 'a independência imediata', 'a abolição da escravidão', 'a proclamação da República', 'a perda do Rio de Janeiro'], 'Dom João abriu os portos, criou o Banco do Brasil, a Imprensa Régia e o Jardim Botânico. Em 1815, o Brasil foi elevado a Reino Unido a Portugal.'],
    ['A independência do Brasil, em 1822, foi:', ['conduzida pelas elites, mantendo a monarquia e a escravidão', 'resultado de uma revolução popular que aboliu a escravidão', 'proclamada por Tiradentes', 'seguida da adoção imediata da república', 'feita sem nenhuma guerra ou resistência'], 'Dom Pedro proclamou a independência com apoio das elites. A estrutura social continuou: monarquia, latifúndio e escravidão. Houve lutas em províncias como a Bahia.']
  ],
  h18: [
    ['A Constituição de 1824, outorgada por D. Pedro I, criou o Poder Moderador, que:', ['dava ao imperador poder acima dos outros três poderes', 'garantia o voto das mulheres', 'aboliu a escravidão', 'criou a república', 'deu autonomia total às províncias'], 'Pelo Poder Moderador, o imperador podia dissolver a Câmara e nomear ministros. O voto era censitário (dependia de renda).'],
    ['O Período Regencial (1831–1840) foi marcado por:', ['revoltas provinciais, como a Cabanagem, a Sabinada, a Balaiada e a Farroupilha', 'paz completa no território', 'a abolição da escravidão', 'a Guerra do Paraguai', 'a proclamação da República'], 'Com D. Pedro II criança, regentes governaram. A instabilidade gerou revoltas em várias províncias, e o Golpe da Maioridade antecipou o governo de D. Pedro II.']
  ],
  h19: [
    ['Qual produto foi a base da economia brasileira no Segundo Reinado?', ['O café', 'O açúcar', 'O ouro', 'A borracha', 'O algodão'], 'O café se expandiu pelo Vale do Paraíba e depois pelo oeste paulista. Os barões do café tinham grande poder político.'],
    ['A Guerra do Paraguai (1864–1870) envolveu, contra o Paraguai, a aliança entre:', ['Brasil, Argentina e Uruguai (Tríplice Aliança)', 'Brasil, Chile e Peru', 'Argentina, Bolívia e Chile', 'Brasil, Estados Unidos e Inglaterra', 'Uruguai, Bolívia e Peru'], 'A Tríplice Aliança venceu, mas a guerra deixou o Paraguai devastado. No Brasil, fortaleceu o Exército, que depois teria papel na Proclamação da República.']
  ],
  h20: [
    ['Qual lei, de 1871, declarava livres os filhos de mulheres escravizadas nascidos a partir daquela data?', ['Lei do Ventre Livre', 'Lei Áurea', 'Lei Eusébio de Queirós', 'Lei dos Sexagenários', 'Lei de Terras'], 'Eusébio de Queirós (1850) proibiu o tráfico; Ventre Livre (1871); Sexagenários (1885), para maiores de 60; Lei Áurea (1888) aboliu a escravidão.'],
    ['Um problema social que permaneceu após a Lei Áurea (1888) foi:', ['a falta de políticas de integração dos libertos, que ficaram sem terra, emprego e educação', 'a imediata igualdade social entre negros e brancos', 'a distribuição de terras aos ex-escravizados', 'a indenização dos libertos', 'o fim do preconceito racial'], 'A abolição não veio acompanhada de reforma agrária, escolas ou empregos. As consequências estão na desigualdade racial que persiste no Brasil.']
  ],
  h21: [
    ['O imperialismo do século XIX levou à partilha da África por potências europeias, oficializada na:', ['Conferência de Berlim (1884–1885)', 'Revolução Francesa', 'Conferência de Bretton Woods', 'Paz de Vestfália', 'Guerra Fria'], 'Na Conferência de Berlim, os europeus dividiram a África sem considerar povos e culturas locais, o que gerou conflitos que duram até hoje.'],
    ['Karl Marx e Friedrich Engels, no século XIX, defendiam:', ['o socialismo científico, com a luta de classes levando ao fim do capitalismo', 'o liberalismo econômico sem interferência do Estado', 'o retorno da monarquia absoluta', 'o mercantilismo', 'o fascismo'], 'No Manifesto Comunista (1848), Marx e Engels afirmaram que a história é a história da luta de classes e propuseram que os trabalhadores tomassem os meios de produção.']
  ],
  h22: [
    ['Na Primeira República (1889–1930), a "política do café com leite" foi:', ['a alternância de presidentes de São Paulo e Minas Gerais no poder', 'um acordo de exportação de leite', 'a união entre operários e camponeses', 'uma política de reforma agrária', 'o governo dos militares'], 'As oligarquias paulista (café) e mineira (leite) se revezavam na Presidência, com apoio dos coronéis locais.'],
    ['O coronelismo e o "voto de cabresto" significavam que:', ['os coronéis controlavam o voto da população rural por meio de favores e violência', 'o voto era secreto e livre', 'as mulheres decidiam as eleições', 'só militares votavam', 'não havia eleições'], 'O voto era aberto, o que permitia aos coronéis pressionar e fiscalizar os eleitores. Fraudes eram comuns.']
  ],
  h23: [
    ['A Guerra de Canudos (1896–1897), no sertão da Bahia, foi liderada por:', ['Antônio Conselheiro', 'Tiradentes', 'Zumbi', 'Getúlio Vargas', 'Lampião'], 'Canudos reuniu milhares de sertanejos pobres em torno de Antônio Conselheiro. O governo republicano destruiu o arraial. Euclides da Cunha narrou em "Os Sertões".'],
    ['A Revolta da Vacina (1904), no Rio de Janeiro, foi uma reação:', ['à vacinação obrigatória contra a varíola e às reformas urbanas que expulsaram os pobres do centro', 'à abolição da escravidão', 'à independência do Brasil', 'à chegada da família real', 'ao fim da Primeira Guerra'], 'A população, mal informada e já revoltada com as demolições de cortiços, se rebelou contra a vacinação feita à força, coordenada por Oswaldo Cruz.']
  ],
  h24: [
    ['O estopim da Primeira Guerra Mundial (1914) foi:', ['o assassinato do arquiduque austríaco Francisco Ferdinando em Sarajevo', 'a invasão da Polônia pela Alemanha', 'o ataque a Pearl Harbor', 'a queda do Muro de Berlim', 'a Revolução Russa'], 'O atentado foi o estopim, mas as causas eram mais profundas: disputas imperialistas, nacionalismos e a corrida armamentista entre as potências.'],
    ['A Revolução Russa de 1917 levou ao poder:', ['os bolcheviques, liderados por Lênin, que implantaram o socialismo', 'o czar Nicolau II', 'Hitler', 'os nazistas', 'a monarquia inglesa'], 'Os bolcheviques prometiam "paz, terra e pão". Em 1922 foi criada a União Soviética (URSS).']
  ],
  h25: [
    ['A crise de 1929 começou com:', ['a quebra da Bolsa de Valores de Nova York', 'o fim da Segunda Guerra', 'a Revolução Russa', 'a independência da Índia', 'o assassinato de Kennedy'], 'A superprodução e a especulação levaram ao crash da bolsa. Seguiu-se a Grande Depressão, com desemprego em massa no mundo todo. No Brasil, o preço do café despencou.'],
    ['Nazismo e fascismo tinham em comum:', ['autoritarismo, nacionalismo extremo, culto ao líder e perseguição a opositores', 'defesa da democracia liberal', 'internacionalismo operário', 'liberdade de imprensa', 'fim dos exércitos'], 'Os regimes totalitários de Hitler (Alemanha) e Mussolini (Itália) controlavam a sociedade, usavam propaganda e violência. O nazismo foi responsável pelo Holocausto.']
  ],
  h26: [
    ['Uma das marcas da Era Vargas foi:', ['a criação da CLT, com direitos trabalhistas como salário mínimo e férias', 'a abolição da escravidão', 'a proclamação da República', 'a construção de Brasília', 'o fim do voto feminino'], 'Vargas criou a Consolidação das Leis do Trabalho (1943), o salário mínimo e a Justiça do Trabalho. Em 1932 as mulheres conquistaram o direito ao voto.'],
    ['O Estado Novo (1937–1945) foi um período em que Vargas:', ['governou como ditador, com censura e fechamento do Congresso', 'implantou a democracia plena', 'renunciou ao poder', 'fez a reforma agrária', 'aboliu as leis trabalhistas'], 'Com o pretexto de um suposto plano comunista, Vargas deu um golpe em 1937. Havia censura (DIP), perseguição e centralização do poder.']
  ],
  h27: [
    ['A Segunda Guerra Mundial começou em 1939 com:', ['a invasão da Polônia pela Alemanha nazista', 'o assassinato de Francisco Ferdinando', 'o ataque japonês a Pearl Harbor', 'a bomba de Hiroshima', 'a queda do Muro de Berlim'], 'Inglaterra e França declararam guerra à Alemanha após a invasão da Polônia. Os EUA entraram em 1941, após Pearl Harbor.'],
    ['O Holocausto foi:', ['o genocídio de cerca de 6 milhões de judeus e de outros grupos pelos nazistas', 'uma batalha naval no Pacífico', 'um tratado de paz', 'o lançamento das bombas atômicas', 'a divisão da Alemanha'], 'Os nazistas perseguiram e assassinaram judeus, ciganos, homossexuais, pessoas com deficiência e opositores em campos de concentração e extermínio.']
  ],
  h28: [
    ['A Guerra Fria (1947–1991) foi a disputa entre:', ['Estados Unidos (capitalismo) e União Soviética (socialismo)', 'Inglaterra e França', 'Alemanha e Japão', 'China e Índia', 'Brasil e Argentina'], 'As superpotências disputaram influência, armas nucleares e a corrida espacial, sem guerra direta entre elas, mas com conflitos indiretos (Coreia, Vietnã).'],
    ['O Muro de Berlim, que dividia a cidade, caiu em:', ['1989', '1945', '1961', '2001', '1917'], 'Construído em 1961, o muro caiu em 1989, simbolizando o fim da Guerra Fria. A Alemanha se reunificou em 1990 e a URSS acabou em 1991.']
  ],
  h29: [
    ['O governo de Juscelino Kubitschek (1956–1961) ficou conhecido pelo lema:', ['"50 anos em 5" e pela construção de Brasília', '"Ordem e Progresso"', '"O petróleo é nosso" e a criação da CLT', '"Diretas Já"', '"Brasil, ame-o ou deixe-o"'], 'O Plano de Metas acelerou a industrialização, com destaque para a indústria automobilística. Brasília foi inaugurada em 1960.'],
    ['A campanha "O petróleo é nosso" resultou na criação, em 1953, da:', ['Petrobras', 'Vale do Rio Doce', 'Embraer', 'Eletrobras', 'CSN'], 'No segundo governo Vargas, a Petrobras foi criada com o monopólio estatal do petróleo, após grande mobilização nacionalista.']
  ],
  h30: [
    ['O AI-5 (Ato Institucional nº 5), de 1968, foi o ato mais duro da ditadura militar porque:', ['fechou o Congresso, suspendeu o habeas corpus e ampliou a censura', 'convocou eleições diretas', 'anistiou os presos políticos', 'aprovou a Constituição de 1988', 'acabou com a ditadura'], 'O AI-5 deu poderes quase ilimitados ao presidente e abriu o período mais violento da repressão, com prisões, tortura e mortes.'],
    ['O "milagre econômico" (1968–1973) durante a ditadura foi marcado por:', ['crescimento alto do PIB, mas com aumento da concentração de renda e da dívida externa', 'distribuição de renda igualitária', 'fim da inflação para sempre', 'reforma agrária ampla', 'redução da dívida externa a zero'], 'O país cresceu mais de 10% ao ano, mas os salários foram contidos e a dívida externa disparou, gerando crise nos anos 1980.']

  h31: [
